<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Pet 4</title>
<style>
  html,body{margin:0;background:#0b1220;color:#e8f6ff;font:17px/1.45 system-ui,sans-serif}
  main{padding:20px;max-width:520px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  p{margin:8px 0}
  ul{list-style:none;padding:0;margin:14px 0}
  li{padding:8px 10px;margin:6px 0;background:#15203a;border-radius:8px}
  li.ok{border-left:5px solid #4be3c0} li.bad{border-left:5px solid #ff7a7a} li.unk{border-left:5px solid #f3c95a}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;background:#4be3c0;color:#06212a}
  #btnAR{width:100%;padding:16px;margin:8px 0}
  #log{white-space:pre-wrap;font-size:14px;color:#a9c3e6;margin-top:12px}
  #ov{display:none;position:fixed;inset:0;pointer-events:none}
  #ovHint{position:absolute;left:12px;right:12px;top:14px;padding:10px;border-radius:10px;background:rgba(6,20,40,.65);text-align:center}
  #ovStat{position:absolute;left:8px;right:8px;bottom:118px;padding:6px 10px;border-radius:8px;background:rgba(6,20,40,.65);font-size:12px}
  #ovBtns{position:absolute;left:8px;right:8px;bottom:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;pointer-events:auto}
  #ovBtns button{padding:12px 1px;font-size:12px;background:rgba(75,227,192,.9)}
  #ovBtns button.alt{background:rgba(42,59,99,.9);color:#e8f6ff}
</style>
</head>
<body>
<main>
  <h1>AR Pet — build 4</h1>
  <p>Open in <b>Chrome on the Samsung S21</b>. Wait for the hand-tracking line to turn green before starting.</p>
  <ul id="checks"></ul>
  <button id="btnAR">Start AR</button>
  <p><b>Steps:</b> 1) find the table and tap the middle of a clear patch. 2) Scan it slowly from a few sides, close to objects. 3) Press “Release pet”.</p>
  <div id="log"></div>
</main>
<div id="ov">
  <div id="ovHint"></div>
  <div id="ovStat"></div>
  <div id="ovBtns">
    <button id="bMain">Release pet</button><button id="bFeed">Feed</button><button id="bTalk">Talk</button><button id="bName">Name</button><button id="bWho">Cat</button>
    <button id="bSize" class="alt">Size M</button><button id="bMap" class="alt">Map</button><button id="bDots" class="alt">Finger dot</button><button id="bFlip" class="alt">Flip hand</button><button id="bExit" class="alt">Exit</button>
  </div>
</div>
<script>
// ================= SIM: world map + creature brain (no graphics in here) =================
var N = 96, CELL = 0.01, HALF = N * CELL / 2;
var mapH = new Float32Array(N * N), mapN = new Uint8Array(N * N), mapT = new Uint8Array(N * N), mapS = new Float32Array(N * N);
var mapBase = 0, mapCover = 0, mapDirty = true;       // mapT: 0 unknown, 1 table, 2 object, 3 drop

function mapClear() { mapH.fill(0); mapN.fill(0); mapT.fill(0); mapS.fill(-0.5); mapBase = 0; mapCover = 0; mapDirty = true; }
function mapFlat() { // fallback when the phone gives no depth: assume a clear flat patch
  mapClear();
  for (var j = 0; j < N; j++) for (var i = 0; i < N; i++) if ((i - 48) * (i - 48) + (j - 48) * (j - 48) < 26 * 26) { mapN[j * N + i] = 5; }

}
function mapAdd(x, y, z) { // one measured 3D point, in play-area coordinates

var POSES = {
  sit: { by: -0.08, pitch: -0.55, legF: 0.55, lenF: 1.25, legH: 1.35, lenH: 0.8, headP: 0.5, tailP: -0.1, tailC: 0.5 },

  roll: { roll: 3.14159, by: -0.23, tailP: 0, tailS: 0.4, tailF: 3 },
  tumble: { by: -0.2, ears: 0.8 },
  hang: { pitch: -1.5, legF: -1.57, legH: 0.3, tailS: 0.5, ears: 0.6 },
  stretch: { pitch: 0.35, lenF: 0.6, legF: -0.9, tailP: 1.2, eyes: 0.3 },
  groom: { by: -0.08, pitch: -0.55, legF: 0.55, lenF: 1.25, legH: 1.35, lenH: 0.8, headP: 1.1, headY: 0.5, tailP: -0.1, tailC: 0.5, eyes: 0.4 },
  jump: { legF: -0.9, legH: 0.9, tailP: 0.8 },
  land: { by: -0.12, lenF: 0.6, lenH: 0.6 },
  skid: { pitch: -0.25, legF: -0.8, legH: -0.5, ears: 0.7, by: -0.05 },
  duck: { by: -0.22, lenF: 0.25, lenH: 0.25, ears: 1, eyes: 0.7, tailP: 0, tailC: 0.1 },
  eat: { headP: 0.75, lenF: 0.8, pitch: 0.15, tailP: 0.9 },
  startled: { puff: 1.2, ears: 1, legF: -0.5, legH: 0.5 },
  rub: { roll: 0.25, eyes: 0.2, tailP: 1.4, tailC: 0.05, headP: 0.2 },
  happy: { tailP: 1.3, tailC: 0.08 }
};
var ACT_POSE = { sit: 'sit', lookCam: 'sit', meow: 'sit', beg: 'sit', watch: 'sit', loaf: 'loaf', sleep: 'sleep', wiggle: 'wiggle', edgePeek: 'edgePeek',
  lookUp: 'lookUp', sniff: 'sniff', sniffFinger: 'sniff', climb: 'climb', hiss: 'hiss', petted: 'petted', pushed: 'pushed', roll: 'roll', tumble: 'tumble',
  hang: 'hang', cling: 'hang', stretch: 'stretch', groom: 'groom', jump: 'jump', fall: 'jump', land: 'land', getUp: 'land', skid: 'skid', duck: 'duck',
  eat: 'eat', startled: 'startled', rub: 'rub', swipe: 'sit', hiding: 'duck', spin: 'jump' };
var pose = {}, poseT = {}; (function () { for (var k in POSE0) { pose[k] = POSE0[k]; poseT[k] = POSE0[k]; } })();

function setAct(a, dur) { cat.act = a; cat.t = 0; cat.dur = dur === undefined ? 1 : dur; cat.said = false; if (a !== 'walk' && a !== 'run') { cat.speed = 0; cat.stalk = false; } if (a !== 'petted' && a !== 'rub') SND.purr(false); cat.tremble = 0; cat.slopeP = 0; }

function lineClear(x0, z0, x1, z1, gy) {

  for (var i = 1; i <= n; i++) { var x = x0 + (x1 - x0) * i / n, z = z0 + (z1 - z0) * i / n; if (!solid(x, z) || Math.abs(groundH(x, z) - gy) > 0.02) return false; }

}
function pickTarget(rmin, rmax, awayX, awayZ) {

    var a = rnd(0, 6.283), r = rnd(rmin, rmax), x = cat.x + Math.sin(a) * r, z = cat.z + Math.cos(a) * r;

  for (var r = 0.02; r < 0.5; r += 0.02) for (var i = 0; i < 10; i++) { var a = rnd(0, 6.283), px = x + Math.sin(a) * r, pz = z + Math.cos(a) * r; if (cellType(px, pz) === 1) return [px, pz]; }

    var x = ((k % N) + 0.5) * CELL - HALF, z = (((k / N) | 0) + 0.5) * CELL - HALF, d = Math.hypot(x - cat.x, z - cat.z);

function go(x, z, goal, run) { cat.tx = x; cat.tz = z; cat.goal = goal; setAct(run ? 'run' : 'walk', 9); }

function choose() {

    hPrev = [tipN[0], tipN[1], tipN[2]]; hPrevT = now; hSeen = now; hBox = [u0 - 0.08, v0 - 0.08, u1 + 0.08, v1 + 0.08];
  }
  function boneM(a, b, w) {
    var dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2], len = Math.hypot(dx, dy, dz) || 1e-4, zx = dx / len, zy = dy / len, zz = dz / len;
    var ux = 0, uy = 1, uz = 0; if (Math.abs(zy) > 0.9) { ux = 1; uy = 0; }
    var xx = uy * zz - uz * zy, xy = uz * zx - ux * zz, xz = ux * zy - uy * zx, xl = Math.hypot(xx, xy, xz) || 1; xx /= xl; xy /= xl; xz /= xl;
    var yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx, L = len + w * 0.5;
    return new Float32Array([xx * w, xy * w, xz * w, 0, yx * w, yy * w, yz * w, 0, zx * L, zy * L, zz * L, 0, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2, 1]);
  }

  // ---------- the cat's body, built from blocks ----------
  var FUR = [0.035, 0.035, 0.045, 1], EYE = [0.75, 1.0, 0.25, 1];
  function catParts(root, time) {
    var p = pose, c = cat, out = [], a = c.act, moving = c.speed > 0.001, run = a === "run", ph = c.phase, amp = moving ? (run ? 0.9 : 0.55) : 0;
    var pitch = p.pitch + c.slopeP, by = p.by, roll = a === "tumble" ? c.rollA : p.roll;
    if (run && moving) { pitch += Math.sin(ph) * 0.14; by += Math.abs(Math.sin(ph)) * 0.07; }
    if (a === "hang" || a === "cling") roll += Math.sin(time * 5) * 0.18;
    if (a === "wiggle") roll += Math.sin(time * 22) * 0.08;
    var breathe = 1 + 0.02 * Math.sin(time * (a === "sleep" ? 1.2 : 2.4));
    var B = mul(root, mul(T(0, by + 0.36, 0), mul(RZ(roll), mul(RX(pitch), T(0, -0.36, 0)))));
    function box(M, x, y, z, sx, sy, sz, cl, g) { out.push({ m: mul(M, mul(T(x, y, z), S(sx, sy, sz))), c: cl || FUR, g: g || 0 }); }
    box(B, 0, 0.36, 0, 0.30 * p.puff, 0.26 * breathe * p.puff, 0.62);
    var hp = p.headP, hy = p.headY;
    if (a === "sniff" || a === "sniffFinger") hp += Math.sin(time * 14) * 0.07;
    if (a === "eat") hp += Math.sin(time * 9) * 0.12;
    if (a === "groom") hp += Math.sin(time * 6) * 0.15;
    if (a === "rub") hy += Math.sin(time * 3) * 0.4;
    var H = mul(B, mul(T(0, 0.44, 0.30), mul(RY(hy), mul(RX(hp), T(0, 0.06, 0.10)))));
    box(H, 0, 0, 0, 0.34, 0.28, 0.26);
    var blink = (time % 4.7) > 4.55 ? 0.1 : 1, eo = p.eyes * blink;
    [-1, 1].forEach(function (sx) {
      var ev = p.ears + (c.heard > 0 ? 0.25 + Math.sin(time * 30 + sx) * 0.25 : 0);
      box(mul(H, mul(T(sx * 0.115, 0.14, -0.02), mul(RZ(-sx * ev * 0.9), RX(-ev * 0.6)))), 0, 0.05, 0, 0.09, 0.12, 0.05);
      if (eo > 0.05) box(H, sx * 0.085, 0.02, 0.131, 0.075, 0.075 * eo, 0.012, EYE, 1);
    });
    var sw = Math.sin(ph) * amp, sw2 = Math.sin(ph + 2.2) * amp, leg = [], q;
    leg[0] = p.legF + (run ? sw : sw); leg[1] = p.legF + (run ? sw : -sw); leg[2] = p.legH + (run ? sw2 : -sw); leg[3] = p.legH + (run ? sw2 : sw);
    for (q = 0; q < 4; q++) {
      if (a === "roll") leg[q] += Math.sin(time * (c.kick ? 20 : 4) + q * 1.7) * 0.5;
      if (a === "climb" || a === "cling") leg[q] += Math.sin(time * 16 + q * 3.14) * 0.5;
      if (a === "pushed") leg[q] += Math.sin(time * 40 + q) * 0.05;
    }
    if (a === "swipe") leg[1] -= 1.7 * Math.sin(Math.PI * clamp(c.t / c.dur, 0, 1));
    if (a === "groom") leg[0] -= 1.1;
    var hips = [[-0.10, 0.22, p.lenF], [0.10, 0.22, p.lenF], [-0.10, -0.22, p.lenH], [0.10, -0.22, p.lenH]];
    for (q = 0; q < 4; q++) box(mul(B, mul(T(hips[q][0], 0.24, hips[q][1]), RX(leg[q]))), 0, -0.12 * hips[q][2], 0, 0.08, 0.24 * hips[q][2], 0.08);
    var Tm = mul(B, mul(T(0, 0.42, -0.31), mul(RY(Math.sin(time * p.tailF) * p.tailS), RX(p.tailP)))), tw = 0.06 * (p.puff > 1.1 ? 1.7 : 1);
    for (q = 0; q < 4; q++) { Tm = mul(Tm, RX(p.tailC)); box(Tm, 0, 0, -0.07, tw, tw, 0.14); Tm = mul(Tm, T(0, 0, -0.14)); }
    return out;
  }

  // ---------- every frame ----------
  function onFrame(t, frame) {
    session.requestAnimationFrame(onFrame);
    try { tick(t, frame); } catch (e) { if (!errText) { errText = e.name + ": " + e.message; log("Frame error: " + errText); } }
  }
  function tick(t, frame) {
    var vpose = frame.getViewerPose(refSpace);
    if (!vpose) { stat.textContent = "Tracking lost — move slowly, more light"; return; }
    frames++;
    var time = t / 1000, dt = clamp(time - lastT, 0.001, 0.06); lastT = time;
    var view = vpose.views[0], P = view.projectionMatrix, camM = view.transform.matrix, k, q;

    var centrePose = null, centreHit = null;
    if (hitSource) { var hits = frame.getHitTestResults(hitSource); if (hits.length) { centreHit = hits[0]; centrePose = centreHit.getPose(refSpace); } }
    if (phase === "find" && centrePose && frames % 30 === 0) say("Surface found. Tap the middle of the clear area you want to play on.");
    if (wantPlace) {
      var hit = null;
      if (tapSource) { var tr = frame.getHitTestResultsForTransientInput(tapSource); for (k = 0; k < tr.length && !hit; k++) if (tr[k].results.length) hit = tr[k].results[0]; if (!hit && released) wantPlace = false; }
      else if (released) { hit = centreHit; if (!hit) wantPlace = false; }
      if (hit) { wantPlace = false; tapped(hit); }
    }
    if (anchor && origin) { var ap = frame.getPose(anchor.anchorSpace, refSpace); if (ap) { q = ap.transform.position; origin[0] = q.x; origin[1] = q.y; origin[2] = q.z; } }

    // live depth
    var di = null; useD = 0;
    if (depthOK) { try { di = frame.getDepthInformation(view); } catch (e) { di = null; } }
    if (di && di.data) {
      depthSeen = true;
      if (depthLA) {
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, depthTex); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE_ALPHA, di.width, di.height, 0, gl.LUMINANCE_ALPHA, gl.UNSIGNED_BYTE, new Uint8Array(di.data, 0, di.width * di.height * 2));
        gl.activeTexture(gl.TEXTURE0); useD = 1; dUV = di.normDepthBufferFromNormView.matrix; dRaw = di.rawValueToMeters;
      }
      if (origin && frames % (phase === "scan" ? 2 : 4) === 0) sampleDepth(di, P, camM);
    }
    if (origin) { mapTimer += dt; if (mapTimer > 0.5) { mapTimer = 0; if (depthOK) mapProcess(); } if (mapDirty) mapUpload(); }

    // hand
    if (tracker && binding && frames % hEvery === 0) { try { handDetect(view, P, camM, time); } catch (e) { if (!hErr) hErr = e.name + ": " + e.message; } }
    var hvis = time - hSeen < 0.45, f = hWas ? 1 - Math.exp(-dt * 20) : 1;
    if (hvis) for (k = 0; k < 21; k++) for (q = 0; q < 3; q++) hw[k][q] += (hwT[k][q] - hw[k][q]) * f;
    else hBox = null;
    hWas = hvis;
    hand.vis = hvis && !!origin;
    if (hand.vis) {
      var ids = [5, 6, 7, 8]; for (k = 0; k < 4; k++) for (q = 0; q < 3; q++) hand.pts[k][q] = hw[ids[k]][q] - origin[q];
      hand.tip = hand.pts[3]; hand.tipV = hv; hand.speed = Math.hypot(hv[0], hv[1], hv[2]); hand.steady = hand.speed < 0.05 ? hand.steady + dt : 0;
    }
    if (origin) camL = [camM[12] - origin[0], camM[13] - origin[1], camM[14] - origin[2]];

    if (analyser && frames % 3 === 0) {
      analyser.getFloatTimeDomainData(micBuf); var sum = 0; for (k = 0; k < micBuf.length; k++) sum += micBuf[k] * micBuf[k];
      var rms = Math.sqrt(sum / micBuf.length);
      if (rms > 0.3 && performance.now() - sndT > 900) loudN++; else loudN = 0;
      if (loudN >= 2 && time - lastShout > 4 && phase === "play") { lastShout = time; loudN = 0; shout(); say("That was loud. You scared it!"); }
    }
    simUpdate(dt, time, phase === "play");

    // ---------- draw ----------
    var layer = session.renderState.baseLayer, vp = layer.getViewport(view), V = view.transform.inverse.matrix, cp = view.transform.position;
    gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
    gl.viewport(vp.x, vp.y, vp.width, vp.height);
    gl.colorMask(true, true, true, true); gl.depthMask(true); gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enableVertexAttribArray(0); gl.disable(gl.CULL_FACE);
    function litOn() {
      gl.useProgram(lit.p); gl.uniformMatrix4fv(lit.u.P, false, P); gl.uniformMatrix4fv(lit.u.V, false, V);
      gl.uniform1i(lit.u.uD, 1); gl.uniformMatrix4fv(lit.u.uDUV, false, dUV); gl.uniform1f(lit.u.uRaw, dRaw); gl.uniform4f(lit.u.uVPt, vp.x, vp.y, vp.width, vp.height); gl.uniform1f(lit.u.uUseD, useD);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, depthTex); gl.activeTexture(gl.TEXTURE0);
    }
    function cubeOn() { gl.bindBuffer(gl.ARRAY_BUFFER, cubeP); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0); gl.enableVertexAttribArray(1); gl.bindBuffer(gl.ARRAY_BUFFER, cubeN); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, cubeIB); }
    function sphereOn(two) { gl.bindBuffer(gl.ARRAY_BUFFER, sphereVB); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0); if (two) { gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0); } else gl.disableVertexAttribArray(1); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sphereIB); }
    function shape(M, col, glow, n) { gl.uniformMatrix4fv(lit.u.M, false, M); gl.uniform4fv(lit.u.color, col); gl.uniform1f(lit.u.glow, glow); gl.drawElements(gl.TRIANGLES, n, gl.UNSIGNED_SHORT, 0); }
    function flatOn() { gl.useProgram(flat.p); gl.disableVertexAttribArray(1); gl.bindBuffer(gl.ARRAY_BUFFER, quadVB); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0); gl.uniformMatrix4fv(flat.u.P, false, P); gl.uniformMatrix4fv(flat.u.V, false, V); gl.uniform1f(flat.u.time, time); }
    function mapOn(pts) { gl.useProgram(mapP.p); gl.disableVertexAttribArray(1); gl.bindBuffer(gl.ARRAY_BUFFER, mapVB); gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0); gl.uniformMatrix4fv(mapP.u.P, false, P); gl.uniformMatrix4fv(mapP.u.V, false, V); gl.uniform3f(mapP.u.org, origin[0], origin[1], origin[2]); gl.uniform1f(mapP.u.pts, pts); gl.uniform1f(mapP.u.bias, pts ? 0.002 : -0.004); }

    if (origin && phase === "play") {
      // 1. invisible stand-ins for real things: scanned objects and the hand. They only write depth, so they hide the pet.
      gl.enable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.colorMask(false, false, false, false);
      mapOn(0); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mapIB); gl.drawElements(gl.TRIANGLES, mapCount, gl.UNSIGNED_SHORT, 0);
      if (hvis) { litOn(); gl.uniform1f(lit.u.uUseD, 0); cubeOn(); for (k = 0; k < BONES.length; k++) shape(boneM(hw[BONES[k][0]], hw[BONES[k][1]], BONES[k][2] * 0.01), FUR, 0, 36); }
      gl.colorMask(true, true, true, true); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

      if (!cat.hidden) {
        var wx = origin[0] + cat.x + (cat.tremble ? Math.sin(time * 47) * 0.0012 : 0), wy = origin[1] + cat.y, wz = origin[2] + cat.z;
        // 2. soft shadow on whatever is underneath
        if (solid(cat.x, cat.z)) {
          var gy = groundH(cat.x, cat.z), air = clamp((cat.y - gy) / (SIZE * 3), 0, 1), ss = SIZE * 0.55 * (1 - 0.5 * air);
          if (cat.y >= gy - 0.005) { gl.depthMask(false); flatOn(); gl.uniform1f(flat.u.kind, 0); gl.uniformMatrix4fv(flat.u.M, false, mul(T(wx, origin[1] + gy + 0.003, wz), S(ss, 1, ss))); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.depthMask(true); }
        }
        // 3. the pet
        if (creature === "cat") {
          var Lc = SIZE * 1.2, parts = catParts(mul(T(wx, wy, wz), mul(RY(cat.head), S(Lc, Lc, Lc))), time);
          litOn(); cubeOn(); for (k = 0; k < parts.length; k++) shape(parts[k].m, parts[k].c, parts[k].g, 36);
        } else {
          var SB = SIZE * 0.42, hop = cat.speed > 0.001 ? Math.abs(Math.sin(cat.phase * 0.5)) : 0, rl = cat.act === "tumble" ? cat.rollA : pose.roll;
          var bm = mul(T(wx, wy + hop * SIZE * 0.25, wz), mul(RY(cat.head), mul(T(0, SB * 0.75, 0), mul(RZ(rl), mul(T(0, -SB * 0.75, 0), S(SB * (1 - 0.1 * hop), SB * (1 + 0.15 * hop + pose.by), SB * (1 - 0.1 * hop)))))));
          sphereOn(false); gl.enable(gl.CULL_FACE); gl.depthMask(false);
          gl.useProgram(body.p); gl.uniformMatrix4fv(body.u.P, false, P); gl.uniformMatrix4fv(body.u.V, false, V); gl.uniformMatrix4fv(body.u.M, false, bm); gl.uniform1f(body.u.time, time); gl.uniform3f(body.u.cam, cp.x, cp.y, cp.z);
          gl.uniform1f(body.u.back, 1); gl.cullFace(gl.FRONT); gl.drawElements(gl.TRIANGLES, sphereCount, gl.UNSIGNED_SHORT, 0);
          litOn(); gl.uniform1f(lit.u.uUseD, 0); sphereOn(true); gl.cullFace(gl.BACK);
          var bl = pose.eyes * ((time % 4.2) > 4.05 ? 0.12 : 1), dark = [0.03, 0.10, 0.20, 0.92];
          [-1, 1].forEach(function (sx) { shape(mul(bm, mul(T(sx * 0.36, 0.85, 0.86), S(0.11, 0.16 * Math.max(bl, 0.08), 0.06))), dark, 0, sphereCount); });
          shape(mul(bm, mul(T(0, 0.50, 1.02), S(0.12, 0.045, 0.05))), dark, 0, sphereCount);
          sphereOn(false); gl.useProgram(body.p); gl.uniform1f(body.u.back, 0); gl.drawElements(gl.TRIANGLES, sphereCount, gl.UNSIGNED_SHORT, 0);
          gl.disable(gl.CULL_FACE); gl.depthMask(true);
        }
      }
      // 4. fly and food
      litOn(); sphereOn(true);
      if (fly.on) {
        var fm = T(origin[0] + fly.x, origin[1] + fly.y, origin[2] + fly.z);
        shape(mul(fm, S(0.003, 0.0025, 0.004)), [0.02, 0.02, 0.02, 1], 0, sphereCount);
        if (fly.rest <= 0) { var wf = 0.3 + 0.7 * Math.abs(Math.sin(time * 70)); shape(mul(fm, mul(T(0, 0.002, 0), S(0.007 * wf, 0.0006, 0.003))), [0.8, 0.9, 1, 0.5], 1, sphereCount); }
      }
      if (food.on) shape(mul(T(origin[0] + food.x, origin[1] + food.y, origin[2] + food.z), S(0.006, 0.004, 0.006)), [0.55, 0.3, 0.12, 1], 0, sphereCount);
      if (hvis && showDots) { gl.disable(gl.DEPTH_TEST); gl.uniform1f(lit.u.uUseD, 0); shape(mul(T(hw[8][0], hw[8][1], hw[8][2]), S(0.004, 0.004, 0.004)), [0.5, 1, 0.9, 0.8], 1, sphereCount); }
    }
    gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.colorMask(true, true, true, true);
    if (origin && (phase === "scan" || showMap)) { mapOn(1); gl.drawArrays(gl.POINTS, 0, N * N); }
    if (phase === "find" && centrePose) { flatOn(); gl.uniform1f(flat.u.kind, 1); gl.uniformMatrix4fv(flat.u.M, false, mul(centrePose.transform.matrix, S(0.05, 1, 0.05))); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }

    // ---------- on-screen text ----------
    if (frames % 12 === 0) {
      if (phase === "scan") {
        var pc = Math.round(mapCover * 100);
        say("Scan " + pc + "%. " + (pc < 30 ? "Sweep slowly across the whole area." : pc < 65 ? "Now from another side, and go close to objects." : "Good. Press Release pet when ready (more scanning = better)."));
      }
      stat.textContent = "Depth " + (depthOK ? (depthSeen ? "✓" : "…") : "✗") + " · Lock " + anchorState + " · Hand " + (tracker && binding ? (hvis ? "✓ seen" : "ready") + (hMs ? " " + hMs.toFixed(0) + "ms" : "") : "✗") + " · Mic " + (micState === "on" ? "✓" : listening ? "…" : micState) +
        (phase === "play" ? " · " + topMood() + " · " + cat.act : "") + (errText ? " · ERR " + errText : "") + (hErr ? " · hand: " + hErr : "");
    }
  }
  session.requestAnimationFrame(onFrame);
}
