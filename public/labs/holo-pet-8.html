<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOLO PET</title>
<style>
  html,body{margin:0;background:#0b1220;color:#e8f6ff;font:17px/1.45 system-ui,sans-serif}
  main{padding:20px;max-width:520px;margin:0 auto}
  h1{font-size:34px;letter-spacing:8px;margin:6px 0 0;text-align:center;color:#8ff;text-shadow:0 0 18px #3cf}
  .sub{text-align:center;color:#9bd;margin:0 0 18px} .small{font-size:14px;color:#9ab}
  #capsule{width:96px;height:132px;margin:26px auto 10px;border-radius:48px;background:linear-gradient(#2a3552 0 46%,#7ff 46% 54%,#1b2438 54%);box-shadow:0 0 36px #3cf8, inset 0 0 18px #0008;animation:fl 3s ease-in-out infinite;position:relative}
  #capsule i{position:absolute;left:30%;top:14%;width:16%;height:22%;border-radius:50%;background:#fff3}
  @keyframes fl{50%{transform:translateY(-12px) rotate(3deg)}}
  #btnNew,#btnQuit{width:100%;padding:12px;margin:4px 0;background:#2a3b63;color:#e8f6ff}
  p{margin:8px 0}
  ul{list-style:none;padding:0;margin:14px 0}
  li{padding:8px 10px;margin:6px 0;background:#15203a;border-radius:8px}
  li.ok{border-left:5px solid #4be3c0} li.bad{border-left:5px solid #ff7a7a} li.unk{border-left:5px solid #f3c95a}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;background:#4be3c0;color:#06212a}
  #btnAR{width:100%;padding:16px;margin:8px 0}
  #log{white-space:pre-wrap;font-size:14px;color:#a9c3e6;margin-top:12px}
  #ov{display:none;position:fixed;inset:0;pointer-events:none}
  #ovHint{position:absolute;left:12px;right:12px;top:14px;padding:10px;border-radius:10px;background:rgba(6,20,40,.65);text-align:center}
  #ovStat{position:absolute;left:8px;right:8px;bottom:170px;padding:6px 10px;border-radius:8px;background:rgba(6,20,40,.65);font-size:12px}
  #ovBtns{position:absolute;left:8px;right:8px;bottom:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;pointer-events:auto}
  #ovBtns button{padding:12px 2px;font-size:13px;background:rgba(75,227,192,.9)}
  #ovBtns button.alt{background:rgba(42,59,99,.9);color:#e8f6ff}
</style>
</head>
<body>
<main>
  <div id="capsule"><i></i></div>
  <h1>HOLO PET</h1>
  <p class="sub">a holographic ghost that lives in your room</p>
  <button id="btnAR">Hatch a capsule</button>
  <button id="btnNew" style="display:none">Hatch a new capsule instead</button>
  <button id="btnQuit">Quit game</button>
  <p class="small">Open in <b>Chrome on the Samsung S21</b>. Wait for the hand-tracking line to turn green.</p>
  <ul id="checks"></ul>
  <div id="log"></div>
</main>
<div id="ov">
  <div id="ovHint"></div>
  <div id="ovStat"></div>
  <div id="ovBtns"></div>
</div>
