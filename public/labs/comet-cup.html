  CTX=ctx||{teams:M.o.teams,arena:FX.arena,cond:M.o.cond};
  const stages=[];for(const e of evs){e.stages.forEach((s,i)=>stages.push({s,e,last:i===e.stages.length-1}))}
  if(!stages.length)return Promise.resolve();
  return new Promise(resolve=>{
    const fast=mode==='fast',T1=fast?1000:2800,TV=fast?650:1500,TH=fast?650:1700;      // build-up, the outcome, then a pause to read it
    const sc=document.createElement('div');sc.id='scene';sc.className='scene';
    sc.innerHTML=`<div class="ctop"><canvas class="cine" width="320" height="336"></canvas><div class="tvbug"><i></i>${ctx?'GSN REPLAY':'GSN LIVE'}</div><div class="chead"><div class="sttl"></div><div class="snote"></div></div><div class="gcap"></div><div class="callout"></div><div class="studio"></div><div class="cpop"></div><div class="ffw">▶▶</div></div><div class="sin"></div><div class="sskip">TAP = FAST FORWARD · TAP AGAIN = SKIP</div>`;
    app.appendChild(sc);const inn=sc.querySelector('.sin'),cv=sc.querySelector('.cine'),ttl=sc.querySelector('.sttl'),nte=sc.querySelector('.snote'),gcap=sc.querySelector('.gcap'),cpop=sc.querySelector('.cpop'),co=sc.querySelector('.callout'),ffw=sc.querySelector('.ffw');
    let i=0,phase=0,ended=false,draw=null,vt=0,last=performance.now(),spd=1,cur=null,beat=0,hold=TH;
    const fin=()=>{if(ended)return;ended=true;clearInterval(loop);SC.done=null;sc.remove();resolve()};SC.done=fin;
    const first=p=>p&&p.side!==2&&p.card?p.card.name.split(' ')[0]:'';
    const fill=(ln,s)=>ln.replace('{a}',first(s.a)).replace('{b}',first(s.b)).replace('{t}',first(s.to)||first(s.b));
    const pick=a=>a[Math.floor(Math.random()*a.length)];
    const pop=(ci,txt,big)=>{cpop.className='cpop';void cpop.offsetWidth;cpop.innerHTML=`<img alt="" src="${portraitEx(commCard(ci),COMM[ci].kit,{mouth:big?'o':'smile'},'c'+(big?1:0))}"><div><b>${COMM[ci].name}</b>${esc(txt)}</div>`;cpop.className='cpop on'+(ci?' r':'')};
    const pane=(p,cls,lab,ex,tag)=>p?`<div class="sp ${cls}" style="--kc:${kitOf(p).c1}"><img alt="" src="${portraitEx(p.card,kitOf(p),ex,tag)}"><div class="snm">${p.side===2?'REFEREE':esc(p.card.name.split(' ')[0]).toUpperCase()+' <i>'+p.card.ovr+'</i>'}</div><div class="sst">${lab||''}</div>${p.sta<60||p.knock>0?`<div class="sfx2">${p.knock>0?'✚ KNOCK ':''}${p.sta<30?'EXHAUSTED':p.sta<60?'TIRED':''}</div>`:''}</div>`:`<div class="sp ${cls}"></div>`;
    const minis=(arr,skip)=>arr&&arr.length>1||(arr&&arr.length&&skip==null)?`<div class="minis">${arr.filter(q=>skip==null||q.i!==skip).slice(0,4).map(q=>`<img alt="" data-i="${q.i}" src="${portraitEx(q.card,kitOf(q),{brow:1},'b')}">`).join('')}</div>`:'';
    const show=()=>{cur=stages[i];const{s,e}=cur;if(s.rk!=null)REF.k=s.rk;phase=0;vt=0;spd=1;beat=0;ffw.className='ffw';const pa=clamp(s.pa,.03,.97)*100;co.className='callout';ttl.textContent=s.t;nte.textContent=(e.grade?e.grade+' TIMING. ':'')+(s.ctl&&s.ctl.over?'TOO MUCH LIFT. ':s.ctl&&s.ctl.acc<=0?'AIMED WIDE. ':'')+(s.note||'');gcap.className='gcap';gcap.textContent='';
      try{draw=cine(cv,e,s)}catch(err){draw=null;console.error(err)}
      inn.innerHTML=`<div class="sduel">${pane(s.a,'a',s.la,{brow:1},'b')}${s.as?minis(s.as,null):''}<div class="vs">${s.mate?'TO':'VS'}</div>${pane(s.b,'b',s.lb,{brow:1},'b')}${s.bs&&s.b?minis(s.bs,s.b.i):''}</div>
        <div class="smeter"><i style="width:${pa}%;background:${s.a?kitOf(s.a).c1:'#fff'}"></i><i style="width:${100-pa}%;background:${s.b?(s.mate?'#8890a8':kitOf(s.b).c1):'#8890a8'}"></i><b class="needle"></b></div>
        <div class="sres"></div>`;
      cpop.className='cpop';if(s.k==='kick'&&!ctx&&M.turnNo<=1&&M.score[0]+M.score[1]===0)pop(0,'From the gantry, we go now to the '+NEBULA[hashStr(M.o.teams[0].name)%NEBULA.length]+' Nebula. '+M.o.teams[0].name+' against '+M.o.teams[1].name+(hashStr(M.o.teams[0].name+M.o.teams[1].name)%4===0?'. A grudge match, this one.':', live on GSN.'));else if(e.type==='shot'||e.special||s.k==='ref'||Math.random()<.3)pop((i+e.turn)%2,fill(pick(BUILD[s.k==='ref'?'ref':e.type]||['Here we go…']),s));beep(180,.5,'triangle',.04,2.2);if(e.type==='shot')Crowd.swell(.02,2.5)};
    const result=()=>{const{s,e,last}=cur,isGoal=s.goal===true;phase=1;if(vt<T1)vt=T1;const win=s.win==='a',pa=clamp(s.pa,.03,.97)*100,mine=(s.a&&s.a.side===0)===win;hold=TH*(isGoal?1.7:1)*(spd>1?2.5:1);
      const nd=inn.querySelector('.needle');nd.classList.add('stop');nd.style.left=(win?pa*(.2+Math.random()*.6):pa+(100-pa)*(.2+Math.random()*.6))+'%';
      const A=inn.querySelector('.sp.a'),B=inn.querySelector('.sp.b'),bw=s.mate?win:!win;
      if(s.a){A.classList.add(win?'win':'lose');A.querySelector('img').src=portraitEx(s.a.card,kitOf(s.a),win?{mouth:'smile',dy:-1}:{mouth:'o',blink:1},win?'w':'l')}
      if(s.b){B.classList.add(bw?'win':'lose');B.querySelector('img').src=portraitEx(s.b.card,kitOf(s.b),bw?{mouth:'smile',dy:-1}:{mouth:'o',blink:1},bw?'w':'l')}
      const res=inn.querySelector('.sres');res.textContent=s.txt;res.classList.add('on',isGoal?'isgoal':mine?'good':'bad');
      let pool=LINES[s.win][s.k==='ref'?'ref':e.type]||[''];if(s.out&&OUTL[s.out])pool=OUTL[s.out];if(s.k==='pass1'&&s.out==='ok')pool=s.sp?['You cannot defend against that!']:s.bs&&s.bs.length?LINES.a.pass:['Tidy. Very tidy.','Simple and safe.'];
      if(s.k==='block')pool=[win?'It beats the defender…':'Bodies on the line!'];if(s.k==='recv')pool=[s.sp?'You cannot defend against that!':'Tidy. Very tidy.'];if(s.k==='fumble')pool=OUTL.fumble;if(s.k==='miss')pool=OUTL.miss;if(s.k==='keeper'&&s.out==='wide')pool=OUTL.wide;if(s.k==='keeper'&&s.out==='save')pool=OUTL.save;
      const base=isGoal?WILD:WILD_PLAY,lv=!last||!(e.wow||s.trick)?0:e.wow>=base+(isGoal?16:24)?4:e.wow>=base+(isGoal?8:12)?3:e.wow>=base?2:(e.wow>=base-14||s.trick)&&win?1:0,wild=lv>=2,call=lv?['','STAR','SUPERSTAR','SUPERNOVA','COSMIC'][lv]+(isGoal?' GOAL!':' MOVE!'):'';
      if(lv){co.textContent=(s.trick?s.trick+'! ':'')+call;co.className='callout on l'+lv;sfx.star(lv)}else co.className='callout';
      if(lv&&!wild)pop(1-(i+e.turn)%2,call+' '+fill(pick(pool),s),false);else if(wild)pop(1-(i+e.turn)%2,call+' '+pick(['I have NEVER seen anything like it!','Stop everything. Watch that again!','That is going straight to Cosmic Central!','My antennae have gone numb!']),true);else if(isGoal||e.type==='shot'||s.k==='ref'||(last&&e.after)||e.special||Math.random()<.4)pop(1-(i+e.turn)%2,(last&&e.after)?e.after:fill(pick(pool),s),isGoal);else cpop.className='cpop';
      if(!fast&&spd===1&&last){const kd=s.out==='dribble'?'dribble':isGoal?(s.tally>=3?'hat':wild?'wild':'goal'):s.out==='over'&&Math.random()<.5?'over':'';if(kd){studio(kd);hold+=3300;cpop.className='cpop'}}
      if(s.out==='dribble')Crowd.hush(4);
      if(isGoal){sfx.goal();sfx.roar();Crowd.swell(wild?.2:.13,5);if(s.tally>=3)sfx.hat();if(wild)setTimeout(()=>{sfx.roar();flash()},400);flash();buzz([60,40,120]);gcap.innerHTML=`GOAL!${s.score?'<b>'+s.score[0]+' - '+s.score[1]+'</b>':''}${s.tally>=3?'<i>HAT-TRICK! THE CROWD GO WILD FOR '+esc(s.a.card.name.split(' ')[0]).toUpperCase()+'!</i>':s.tally===2?'<i>THE CROWD ARE SINGING '+esc(s.a.card.name.split(' ')[0]).toUpperCase()+'\'S NAME!</i>':''}`;if(wild)gcap.innerHTML+='<i class="wild">THE CROWD GOES WILD!</i>';gcap.className='gcap on'}else if(wild){Crowd.swell(.14,4);sfx.roar();setTimeout(()=>sfx.roar(),350);flash();buzz([40,30,40,30,90]);gcap.innerHTML='WHAT A PLAY!<i class="wild">THE CROWD GOES WILD!</i>';gcap.className='gcap on'}else if(s.out==='over'||s.out==='out'){Crowd.swell(.05,3);(mine?sfx.win:sfx.lose)()}else if(s.out==='block'||s.out==='save'||(last&&e.type==='tackle'&&e.wow)){Crowd.swell(.07,3);sfx.roar();buzz([30,20,30]);gcap.innerHTML=s.out==='block'?'BLOCKED!':s.out==='save'?'SAVED!':'WHAT A TACKLE!';gcap.className='gcap on sm'}else if(s.k==='ref'&&!win){sfx.whistle();buzz(40)}else{(mine?sfx.win:sfx.lose)();buzz(25)}};
    // the commentary gantry slides in for the big reactions: he loses his mind, she stays perfectly calm
    let stT=[];const stu=sc.querySelector('.studio');
    const studio=kind=>{const d=pick(GANTRY[kind]);stu.innerHTML=`<canvas width="200" height="96"></canvas><b class="stl2">GSN GANTRY · LIVE</b><img class="c0" alt="" src="${portraitEx(commCard(0),COMM[0].kit,{mouth:'o',dy:-1},'gz1')}"><img class="c1" alt="" src="${portraitEx(commCard(1),COMM[1].kit,{brow:1},'go1')}"><div class="sbub"></div>`;drawGantry(stu.querySelector('canvas'));
      const bub=stu.querySelector('.sbub'),say2=(k,t)=>{bub.className='sbub s'+k;bub.innerHTML='<i>'+COMM[k].name+'</i>'+esc(t);stu.querySelector('.c'+k).classList.add('talk');stu.querySelector('.c'+(1-k)).classList.remove('talk')};
      stT.push(setTimeout(()=>{stu.className='studio on';say2(0,d[0]);sfx.tap()},650),setTimeout(()=>say2(1,d[1]),2500),setTimeout(()=>{stu.className='studio'},4600))};
    const next=()=>{stT.forEach(clearTimeout);stT=[];stu.className='studio';i++;if(i>=stages.length)fin();else show()};
    const loop=setInterval(()=>{const now=performance.now(),dt=Math.min(120,now-last);last=now;if(!cur||ended)return;vt+=dt*spd;
      if(phase===0&&vt>=T1)result();else if(phase===1&&vt>=T1+TV+hold){next();return}
      if(phase===0&&spd===1&&vt>T1*.45&&now-beat>430){beat=now;beep(62,.13,'sine',.09);beep(52,.1,'sine',.07,0,.14)}       // heartbeat while time slows
      if(draw)try{draw(phase,vt/T1,(vt-T1)/TV,now)}catch(err){draw=null;console.error(err)}},33);
    sc.addEventListener('click',ev=>{ev.stopPropagation();if(phase===1&&vt>=T1+TV)next();else if(spd===1){spd=7;ffw.className='ffw on'}else if(phase===0)result();else next()});
    show();
  });
}
function afterAct(){ // show any close-ups, then redraw the pitch and keep the match moving
  const evs=M.ev.splice(0);MU.busy=true;stopTimerOnly();
  playEvents(evs).then(()=>{MU.busy=false;if(view!=='match')return;mDraw();if(M.air&&!M.over&&humanTurn()&&!MU.auto&&airSheet())return;if(M.air&&humanTurn())M.air=null;pump()});
}
function stopTimerOnly(){clearTimeout(MU.timer);MU.timer=null}
function pump(){
  stopTimerOnly();if(!M||M.over||view!=='match'){mDraw();return}
  if(humanTurn()){if(M.ap<=0||!M.P.some(p=>options(M,p).length)){MU.timer=setTimeout(()=>{endTurn(M);MU.sel=null;MU.opts=[];afterAct()},500)}return}
  MU.timer=setTimeout(()=>{M.peek=true;M.pick=null;const ok=M.ap>0&&aiAct(M);M.peek=false;
    if(!ok||!M.pick){endTurn(M);MU.sel=null;afterAct();return}
    const[p,op]=M.pick,go=dq=>{act(M,p,dq?Object.assign({},op,{dq}):op);sfx.kick();MU.sel=null;afterAct()};
    // when the computer shoots at you, or tackles your player, you get one quick timing tap. It is centred: a decent tap changes nothing,
    // a great one helps a little, a poor one hurts a little, so it is involvement, not a free advantage.
    const mine=M.o.human[1-M.turn]&&!MU.auto&&S.ctl!=='auto'&&!op.sp,gk=op.t==='shoot'?at(M,...goalOf(p.side)):null,vic=op.t==='tackle'&&op.v!=='team'?op.q:null,who=gk||vic;
    if(!mine||!who||who.side===p.side){go(0);return}
    strike(who,[Object.assign({},op,{q:p})],'tap',gk?{title:'SAVE IT!',note:nm(p)+' shoots. Time the dive.'}:{title:'DODGE!',note:nm(p)+' comes in for the tackle.'}).then(r=>go(r?({PERFECT:1,SUPERB:.5,'VERY GOOD':0,GOOD:-.5,BAD:-1,MISKICK:-1.5})[r.grade]:0))},MU.auto&&!M.o.human[0]?480:700);
}
function doOp(who,op){
  if(op.t==='ctrl'){M.air=null;closeSheet();MU.sel=who.i;MU.opts=options(M,who);mDraw();pump();return}
  if(op.air&&op.tq==null&&S.ctl!=='auto'){closeSheet();strike(who,[op],'tap',{title:op.air.toUpperCase()+'!',note:nm(who)+' meets it first time. Time the strike.',keep:1}).then(r=>doOpNow(who,Object.assign({},op,r||{tq:0})));return}
  if(op.air||op.fl){doOpNow(who,op);return}
  if(S.ctl!=='auto'&&M.o.human[M.turn]&&!op.sp&&!op.ctl&&op.tq==null&&!document.getElementById('strike')){
    if(op.t==='pass'||op.t==='shoot'){const ops=MU.opts.filter(o=>o.t===op.t&&o.x===op.x&&o.y===op.y&&!o.sp);closeSheet();
      strike(who,ops,op.t).then(r=>{if(!r){mDraw();return}const v=op.t==='pass'?(r.sy>.35&&ops.find(o=>o.v==='lob')?'lob':'ground'):'placed';doOpNow(who,Object.assign({},ops.find(o=>o.v===v)||ops[0],{ctl:r}))});return}
    if((op.t==='drib'||op.t==='tackle')&&op.v!=='team'){closeSheet();strike(who,[op],'tap').then(r=>{if(!r){mDraw();return}doOpNow(who,Object.assign({},op,r))});return}}
  doOpNow(who,op)}
function doOpNow(who,op){closeSheet();MU.info=null;act(M,who,op);sfx.kick();buzz(15);MU.sel=null;MU.opts=[];
  const c=M.P[M.ball];if(!M.over&&M.ap>0&&c.side===M.turn&&!c.acted&&M.o.human[M.turn]){MU.sel=c.i;MU.opts=options(M,c)}
  afterAct()}
ACT.mcard=()=>{const ip=MU.info!=null?M.P[MU.info]:MU.sel!=null?M.P[MU.sel]:null;if(!ip)return;sfx.tap();openDetail(ip.card,M.o.teams[ip.side],ip.side===0?recOfCard(ip.card)||null:null)};
function closeSheet(){const s=document.getElementById('sheet');if(s)s.innerHTML=''}
function chooseAt(x,y){ // one choice: do it. Several: ask how.
  const who=M.P[MU.sel];let ops=MU.opts.filter(o=>o.x===x&&o.y===y);if(!ops.length)return false;
  if(S.ctl!=='auto'&&(ops[0].t==='pass'||ops[0].t==='shoot')){const sp=ops.filter(o=>o.sp);if(!sp.length){doOp(who,ops[0]);return true}ops=[Object.assign({},ops[0],{flick:1})].concat(sp)}
  if(ops.length===1&&ops[0].t!=='charge'){doOp(who,ops[0]);return true}
  const q=ops[0].q,ttl=ops[0].t==='shoot'?'HOW WILL '+nm(who).toUpperCase()+' SHOOT?':ops[0].t==='pass'?'PASS TO '+nm(q).toUpperCase():ops[0].t==='drib'?'TAKE ON '+nm(q).toUpperCase():ops[0].t==='charge'?'OFF THE BALL: '+nm(q).toUpperCase():'TACKLE '+nm(q).toUpperCase();
  MU.sheet=ops;document.getElementById('sheet').innerHTML=`<div class="sheet"><div class="px sh1">${ttl}</div>${ops.map((o,i)=>`<button class="btn sm ${o.sp?'':'white'} shb" data-a="pickOp" data-i="${i}"><span>${o.flick?(o.t==='shoot'?'SHOOT':'PASS')+' WITH YOUR FINGER':opLabel(who,o)}${o.mate?' WITH '+nm(o.mate).toUpperCase():''}<small>${o.sp?'Special move. '+who.sp+' left this match':o.flick?'Aim, pull back and let go':VHINT[o.v]}</small></span><b>${o.flick?'':Math.round(o.p*100)+'%'}</b></button>`).join('')}<button class="btn sm pink" data-a="noOp">CANCEL</button></div>`;
  sfx.tap();return true}
ACT.pickOp=d=>{const op=MU.sheet[+d.i];if(op&&MU.sel!=null)doOp(M.P[MU.sel],op)};
ACT.noOp=()=>{closeSheet();sfx.tap();if(M&&M.air){M.air=null;pump()}};
// the ball has dropped out of the air to your player: bring it down, or meet it first time
function airSheet(){const os=airOptions(M);if(os.length<2)return false;const who=M.P[M.air.i],z=M.air.zone==='head'?'AT HEAD HEIGHT':'ON THE VOLLEY';MU.sel=who.i;MU.opts=os;MU.sheet=os;
  document.getElementById('sheet').innerHTML=`<div class="sheet"><div class="px sh1">IN THE AIR! IT DROPS TO ${nm(who).toUpperCase()} ${z}</div>${os.map((o,i)=>`<button class="btn sm ${o.air?'':'white'} shb" data-a="pickOp" data-i="${i}"><span>${o.t==='ctrl'?'BRING IT DOWN':o.air?o.air.toUpperCase()+' AT GOAL':'FLICK IT ON TO '+nm(o.q).toUpperCase()}<small>${o.t==='ctrl'?'Keep the ball. Costs nothing.':o.air?'First time, one timing tap. Uses an action.':'A first-time '+o.fl+' pass. Uses an action.'}</small></span><b>${o.t==='ctrl'?'':Math.round(o.p*100)+'%'}</b></button>`).join('')}</div>`;sfx.star(1);return true}
ACT.cell=d=>{if(!M||M.over)return;const x=+d.x,y=+d.y,p=at(M,x,y);closeSheet();
  if(!humanTurn()){MU.info=p?p.i:null;mDraw();return}
  if(MU.sel!=null&&chooseAt(x,y))return;
  if(p&&p.side===M.turn){const o=options(M,p);MU.info=p.i;if(o.length){MU.sel=p.i;MU.opts=o;sfx.tap()}else{MU.sel=null;MU.opts=[];sfx.no()}}
  else{MU.sel=null;MU.opts=[];MU.info=p?p.i:null}
  mDraw()};
const cellOf=el=>{const c=el&&el.closest('.cell');return c?[+c.dataset.x,+c.dataset.y]:null};
DROP.match={pick:el=>{if(!humanTurn())return null;const xy=cellOf(el);if(!xy)return null;const p=at(M,xy[0],xy[1]);if(!p||p.side!==M.turn)return null;const o=options(M,p);if(!o.length)return null;
    closeSheet();MU.sel=p.i;MU.opts=o;MU.info=p.i;mDraw();return portraitURL(p.card,M.o.teams[p.side])},
  drop:(el,t)=>{const xy=cellOf(t);if(!xy||MU.sel==null){mDraw();return}if(!chooseAt(xy[0],xy[1])){sfx.no();mDraw()}}};
ACT.endTurn=()=>{if(!humanTurn())return;sfx.tap();closeSheet();stopTimerOnly();endTurn(M);MU.sel=null;MU.opts=[];MU.info=null;afterAct()};
ACT.autoT=()=>{MU.auto=!MU.auto;MU.sel=null;MU.opts=[];closeSheet();sfx.tap();mDraw();if(!MU.busy)pump()};
ACT.skip=()=>{stopMatchTimers();MU.busy=false;M_auto(M);M.ev.length=0;mDraw()};
ACT.quit=()=>{if(M.over){go('menu');return}if(!MU.q){MU.q=true;document.getElementById('minfo').innerHTML='TAP ✕ AGAIN TO LEAVE THE MATCH (IT WON\'T COUNT).';setTimeout(()=>MU.q=false,2500);return}stopMatchTimers();go('menu')};
function finish(){
  MU.done=true;stopTimerOnly();sfx.whistle();const a=M.score[0],b=M.score[1],t=M.o.teams;let head,lines=[],inj=[];
  if(MU.mode==='two'){head=a>b?'PLAYER 1 WINS!':a<b?'PLAYER 2 WINS!':'A DRAW!';lines=['A friendly: nothing is recorded.']}
  else{const out=applyMatch(M,FX);head=out.head;lines=out.lines;inj=out.inj;if(!save())lines.push('<b style="color:#d6204f">Warning: this device would not save the result.</b>')}
  const best=[...M.pst.entries()].map(([c,s])=>({c,s,v:s.g*5+s.a*3+s.tk+s.sv*1.5})).sort((x,y)=>y.v-x.v)[0];
  document.getElementById('res').innerHTML=`<div class="result"><div class="panel center"><h2 style="font-size:16px;margin-bottom:12px">${head}</h2>
    <div class="px" style="font-size:10px;line-height:1.8">${esc(t[0].name)} ${a}<br>${t[1].name.toUpperCase()} ${b}</div>
    <p class="small">${M.goals.map(g=>`${esc(g.name)} ${g.min}'${g.assist?' (assist '+esc(g.assist.split(' ')[0])+')':''}`).join('<br>')||'No goals.'}</p>
    <p class="small">Shots ${M.shots[0]} v ${M.shots[1]}${M.reds[0]+M.reds[1]?` · Red cards ${M.reds[0]} v ${M.reds[1]}`:''}${best&&best.v>0?` · Star of the match: <b>${esc(best.c.name)}</b>`:''}</p>
    ${lines.map(l=>`<p class="small">${l}</p>`).join('')}${inj.length?`<p class="small" style="color:#d6204f">${inj.map(esc).join('<br>')}</p>`:''}</div>
    ${M.hl.length?`<button class="btn cyan" data-a="highlights">WATCH HIGHLIGHTS (${M.hl.length})</button>`:''}
    <button class="btn pink" data-a="go" data-v="${MU.mode==='two'?'menu':S.pending.length?'packs':'menu'}">${MU.mode!=='two'&&S.pending.length?'OPEN MY PRIZE PACK':'CONTINUE'}</button></div>`;
}
ACT.highlights=()=>{sfx.tap();playEvents(M.hl,'full',{teams:M.o.teams,arena:FX.arena,cond:M.o.cond})};

/* ---------- start ---------- */
load();drawStars();go('menu');
</script>
