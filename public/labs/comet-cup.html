<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Comet Cup — Development Build</title>
<style>
@font-face{font-family:"Press Start 2P";src:url("./fonts/press-start-2p-400.ttf") format("truetype");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"Pixelify Sans";src:url("./fonts/pixelify-sans-400.ttf") format("truetype");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"Pixelify Sans";src:url("./fonts/pixelify-sans-600.ttf") format("truetype");font-style:normal;font-weight:600;font-display:swap}
@font-face{font-family:"Pixelify Sans";src:url("./fonts/pixelify-sans-700.ttf") format("truetype");font-style:normal;font-weight:700;font-display:swap}
</style>
<style>
:root{
  --ink:#1b1340; --cream:#fff8e7; --pink:#ff4f9a; --yel:#ffd21f; --cyan:#19d3e6; --grn:#3ddc84; --vio:#6a4dff;
  --px:"Press Start 2P","Courier New",monospace; --bd:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --holo:#6ff7ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--bd);font-size:17px;color:var(--ink);background:#2b1d7a;overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;background:linear-gradient(180deg,#2b1d7a 0%,#5a35c9 38%,#c45fd6 72%,#ff9ec4 100%);z-index:0}
#bg canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#app{position:relative;z-index:1;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 12px 12px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen>*{flex-shrink:0}
.px{font-family:var(--px)}
h1,h2,h3{font-family:var(--px);margin:0;line-height:1.35}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex:none}
.topbar h2{flex:1;color:#fff;font-size:13px;text-shadow:2px 2px 0 var(--ink);text-align:center}
.back{font-family:var(--px);font-size:11px;background:var(--cream);border:3px solid var(--ink);border-radius:10px;padding:9px 10px;box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.panel{background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:12px;margin-bottom:12px}
.panel.dark{background:#17103f;color:#e9f6ff;border-color:#0b0724}
.btn{display:block;width:100%;font-family:var(--px);font-size:12px;line-height:1.4;color:var(--ink);background:var(--yel);border:3px solid var(--ink);border-radius:14px;
  padding:14px 10px;box-shadow:0 5px 0 var(--ink);margin:0 0 12px;cursor:pointer;text-align:center;position:relative;transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff}.btn.cyan{background:var(--cyan)}.btn.grn{background:var(--grn)}.btn.vio{background:var(--vio);color:#fff}
.btn.white{background:var(--cream)}.btn.sm{font-size:10px;padding:10px 8px;margin-bottom:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .badge{position:absolute;right:-6px;top:-8px;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:4px 7px;font-size:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
.muted{opacity:.7}.center{text-align:center}.small{font-size:14px}
.chip{display:inline-block;font-family:var(--px);font-size:9px;padding:6px 8px;border:2px solid var(--ink);border-radius:20px;background:#fff;margin:2px}
.chip.on{background:var(--ink);color:#fff}

/* ---------- title ---------- */
.logo{text-align:center;margin:18px 0 10px;position:relative}
.logo .l1{font-family:var(--px);font-size:38px;color:var(--yel);letter-spacing:2px;text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--ink)}
.logo .l2{font-family:var(--px);font-size:46px;color:#fff;letter-spacing:6px;text-shadow:3px 3px 0 var(--cyan),6px 6px 0 var(--ink);margin-top:10px}
.logo .tag{font-family:var(--px);font-size:9px;color:#fff;margin-top:16px;text-shadow:2px 2px 0 var(--ink);line-height:1.6}
.logo canvas{width:96px;height:96px;image-rendering:pixelated;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.teamline{display:flex;align-items:center;gap:10px}
.swatch{width:26px;height:26px;border:3px solid var(--ink);border-radius:8px;display:inline-block;vertical-align:middle}
.ver{font-family:var(--px);font-size:8px;color:#fff;opacity:.75;text-align:center;margin-top:4px;line-height:1.6}

/* ---------- dialogue ---------- */
.dlg{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end;min-height:0}
.dlg .who{align-self:center;width:190px;height:190px;image-rendering:pixelated;animation:bob 1.8s ease-in-out infinite;filter:drop-shadow(0 8px 0 #0004)}
.bubble{position:relative;background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:14px;margin:14px 0 12px;font-size:19px;line-height:1.35;min-height:118px}
.bubble:before{content:"";position:absolute;top:-14px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom-color:var(--ink);border-top:0}
.bubble .nm{font-family:var(--px);font-size:9px;color:var(--pink);margin-bottom:8px}
.bubble input{width:100%;font-family:var(--px);font-size:13px;padding:12px;border:3px solid var(--ink);border-radius:10px;margin-top:10px;background:#fff;color:var(--ink);text-transform:uppercase;-webkit-user-select:text;user-select:text}
.err{color:#d6204f;font-size:15px;margin-top:6px;min-height:20px}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 4px}
.pal button{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:10px;cursor:pointer;padding:0}
.pal button.on{outline:4px solid #fff;box-shadow:0 0 0 7px var(--ink);transform:scale(.86)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid.g4{grid-template-columns:repeat(4,1fr);gap:8px}
.card{position:relative;border-radius:10px;padding:4px;background:var(--fr,#9aa3b8);background-size:300% 300%;box-shadow:0 4px 0 #0009;color:#fff;font-family:var(--px);cursor:pointer;min-width:0}
.card .in{position:relative;border-radius:7px;background:linear-gradient(#1c1552,#0c0828);overflow:hidden}
.card .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 5px 2px;font-size:8px}
.card .ovr{font-size:13px;color:var(--yel);text-shadow:1px 1px 0 #000}
.card .pos{background:#ffffff22;border-radius:4px;padding:3px 4px;font-size:7px}
.card .art{position:relative;aspect-ratio:1/1;margin:0 4px;border-radius:5px;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,var(--k1,#6a4dff)55 0,#0000 68%),linear-gradient(180deg,#2c2380,#141042)}
.card .art:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff0a 0 2px,#0000 2px 6px)}
.card .art img,.card .art canvas{position:relative;width:100%;height:100%;image-rendering:pixelated;display:block}
.card .nm{font-size:7px;padding:5px 4px 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.card .sub{font-family:var(--bd);font-size:11px;text-align:center;opacity:.8;padding:0 3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rl{font-size:6px;text-align:center;padding:0 2px 5px;letter-spacing:.5px;color:var(--rc,#cfd6e6)}
.card .fx{position:absolute;inset:0;border-radius:10px;pointer-events:none;overflow:hidden}
.card.inj .art{filter:grayscale(.9) brightness(.7)}
.card .injt{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:7px;background:#d6204f;padding:4px 0;z-index:3}
.card.sel{outline:4px solid var(--yel);outline-offset:2px}
.card.used:after{content:"IN TEAM";position:absolute;right:3px;top:3px;font-size:6px;background:var(--grn);color:var(--ink);padding:3px;border-radius:4px;z-index:3}
.r0{--fr:linear-gradient(160deg,#c5cbd9,#7b8398);--rc:#cfd6e6}
.r1{--fr:linear-gradient(160deg,#8df0a8,#1f9c57);--rc:#8df0a8}
.r2{--fr:linear-gradient(160deg,#8fd0ff,#2b6fe0);--rc:#8fd0ff}
.r3{--fr:linear-gradient(160deg,#d9a3ff,#7a2fd0);--rc:#d9a3ff}
.r4{--fr:linear-gradient(160deg,#fff3a0,#ffb700 45%,#c97a00);--rc:#ffe066}
.r5{--fr:conic-gradient(from 20deg,#a8fbff,#fff,#ffb3f2,#9fc7ff,#fff,#b6fff0,#ffc9f6,#a8fbff);--rc:#b6fbff}
.r6{--fr:linear-gradient(115deg,#5c6270,#f4f6fa 18%,#8b92a1 36%,#ffffff 52%,#6d7482 70%,#e3e7ee 88%,#5c6270);--rc:#f4f6fa}
.r7{--fr:linear-gradient(115deg,#ff4fd8,#4ff3ff,#fff34f,#4fff9a,#ff4fd8,#4ff3ff);--rc:#7ffcff;animation:slide 3.5s linear infinite}
.r8{--fr:linear-gradient(115deg,#0b0724,#ff4fd8,#0b0724,#4ff3ff,#0b0724,#fff34f,#0b0724);--rc:#fff;animation:slide 2.4s linear infinite}
@keyframes slide{to{background-position:300% 0}}
.r5 .fx{background:
  linear-gradient(125deg,#fff0 38%,#ffffff88 48%,#bff7ff55 52%,#fff0 62%),
  conic-gradient(from 200deg at 12% 14%,#fff5 0 8%,#0000 8% 16%,#bff7ff55 16% 24%,#0000 24% 100%),
  conic-gradient(from 20deg at 88% 86%,#ffd0f855 0 9%,#0000 9% 17%,#fff5 17% 26%,#0000 26% 100%);
  background-size:260% 100%,100% 100%,100% 100%;mix-blend-mode:screen;animation:glint 3.2s ease-in-out infinite}
@keyframes glint{0%{background-position:120% 0,0 0,0 0}60%,100%{background-position:-60% 0,0 0,0 0}}
.r6 .fx{background:linear-gradient(110deg,#fff0 36%,#ffffffd0 50%,#fff0 64%);background-size:260% 100%;mix-blend-mode:screen;animation:sheen 2.1s linear infinite}
@keyframes sheen{0%{background-position:130% 0}100%{background-position:-70% 0}}
.r7 .fx,.r8 .fx{background:repeating-linear-gradient(115deg,#ff4fd866,#4ff3ff66 12%,#fff34f66 24%,#4fff9a66 36%,#ff4fd866 48%);background-size:300% 300%;mix-blend-mode:color-dodge;animation:holo 5s linear infinite;opacity:.75}
@keyframes holo{to{background-position:300% 300%}}
.r8 .in{background:radial-gradient(circle at 30% 20%,#3b1a7a,#05030f 70%)}
.r8 .art{background:radial-gradient(circle at 50% 40%,#ffffff44 0,#0000 60%),radial-gradient(1px 1px at 20% 30%,#fff,#0000),radial-gradient(1px 1px at 70% 20%,#fff,#0000),radial-gradient(1px 1px at 80% 70%,#fff,#0000),radial-gradient(1px 1px at 30% 80%,#fff,#0000),#07041a}
.spark{position:absolute;width:6px;height:6px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 1.4s ease-in-out infinite;pointer-events:none;z-index:4}
@keyframes tw{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1.5);opacity:1}}

/* card back + flip */
.flip{perspective:700px;cursor:pointer}
.flip .ff{position:relative;transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip .front,.flip .backf{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .backf{position:absolute;inset:0;border-radius:10px;border:3px solid var(--ink);background:repeating-linear-gradient(45deg,#6a4dff 0 8px,#5a3be6 8px 16px);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 4px 0 #0009}
.flip .backf b{font-family:var(--px);font-size:9px;color:var(--yel);text-shadow:2px 2px 0 var(--ink);line-height:1.7;text-align:center}
.flip .front{transform:rotateY(180deg)}
.flip.open .ff{transform:rotateY(180deg)}
.flip.open .backf{pointer-events:none}
.banner{font-family:var(--px);font-size:12px;color:#fff;text-align:center;text-shadow:2px 2px 0 var(--ink);min-height:36px;margin:8px 0;line-height:1.5}
.banner.big{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
#flash.go{animation:fl .6s}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}

/* ---------- pack ---------- */
.packstage{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.pack{position:relative;width:210px;height:300px;touch-action:none;cursor:pointer;filter:drop-shadow(0 10px 0 #0005);animation:bob 2s ease-in-out infinite}
.pack .ptop,.pack .pbody{position:absolute;left:0;right:0;background:linear-gradient(115deg,#ff4f9a,#8a4dff 35%,#19d3e6 70%,#ffd21f);background-size:100% 300px;overflow:hidden}
.pack .ptop{top:0;height:44px;border-radius:8px 8px 0 0;transform-origin:0 100%;transition:transform .6s ease-in,opacity .6s;z-index:3;
  -webkit-mask:linear-gradient(#000,#000);mask:linear-gradient(#000,#000)}
.pack .ptop:before,.pack .pbody:after{content:"";position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,#0003 0 4px,#fff3 4px 8px)}
.pack .ptop:before{top:0}.pack .pbody:after{bottom:0}
.pack .pbody{top:44px;bottom:0;border-radius:0 0 8px 8px;background-position:0 -44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pack .shine{position:absolute;inset:0;background:linear-gradient(105deg,#fff0 40%,#fff7 50%,#fff0 60%);background-size:250% 100%;animation:sheen 2.6s linear infinite;pointer-events:none}
.pack .pt1{font-family:var(--px);font-size:24px;color:var(--yel);text-shadow:3px 3px 0 var(--ink)}
.pack .pt2{font-family:var(--px);font-size:30px;color:#fff;text-shadow:3px 3px 0 var(--ink);letter-spacing:4px}
.pack .pt3{font-family:var(--px);font-size:8px;color:#fff;background:var(--ink);padding:6px 8px;border-radius:12px;margin-top:6px}
.pack canvas{width:72px;height:72px;image-rendering:pixelated}
.pack .tear{position:absolute;left:0;top:40px;height:8px;width:0;z-index:4;background:
  linear-gradient(135deg,#fff 25%,#0000 25%) 0 0/8px 8px,linear-gradient(225deg,#fff 25%,#0000 25%) 0 0/8px 8px,linear-gradient(315deg,#fff 25%,#0000 25%) 0 0/8px 8px,linear-gradient(45deg,#fff 25%,#0000 25%) 0 0/8px 8px;background-color:var(--ink)}
.pack.torn{animation:none}
.pack.torn .ptop{transform:translate(40px,-120px) rotate(35deg);opacity:0}
.pack.torn .tear{opacity:0}
.pack .peek{position:absolute;left:22px;right:22px;top:50px;height:80px;background:var(--cream);border:3px solid var(--ink);border-radius:8px 8px 0 0;z-index:1;transition:transform .5s .2s}
.pack.torn .peek{transform:translateY(-58px)}
.pack .pbody{z-index:2}
.hint{font-family:var(--px);font-size:10px;color:#fff;text-shadow:2px 2px 0 var(--ink);margin-top:26px;text-align:center;line-height:1.7;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.5}}

/* ---------- detail modal ---------- */
#modal{position:fixed;inset:0;z-index:40;background:#0b0724e8;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px 14px 14px;overflow-y:auto}
#modal.on{display:flex}
.bigwrap{position:relative;width:min(330px,88vw);margin-top:8px;perspective:900px}
.bigwrap.proj{margin-top:146px}
.card.lg{cursor:default;padding:7px;border-radius:16px;transition:transform .12s}
.card.lg .in{border-radius:11px}
.card.lg .hd{padding:9px 10px 5px}
.card.lg .ovr{font-size:26px}
.card.lg .pos{font-size:10px;padding:5px 7px}
.card.lg .rar{font-size:8px;color:var(--rc);text-align:right;line-height:1.5}
.card.lg .art{margin:0 9px;aspect-ratio:1/.82;cursor:pointer}
.card.lg .art canvas{height:100%;width:auto;margin:0 auto;aspect-ratio:1/1}
.card.lg .nm{font-size:13px;padding:9px 6px 3px}
.card.lg .sub{font-size:15px}
.card.lg .fx{border-radius:16px}
.tapme{position:absolute;right:6px;bottom:6px;font-size:7px;background:#000a;padding:4px 5px;border-radius:5px;z-index:2;color:var(--holo)}
.hpanel{position:relative;margin:4px 9px 9px;padding:9px;border:1px solid #6ff7ff66;border-radius:8px;background:linear-gradient(180deg,#0a2a4a99,#07122e99);color:var(--holo);box-shadow:inset 0 0 18px #19d3e633,0 0 10px #19d3e633;overflow:hidden;animation:hin .5s steps(6)}
@keyframes hin{0%{opacity:0;transform:scaleY(.1)}40%{opacity:.4}60%{opacity:.9}70%{opacity:.5}100%{opacity:1;transform:none}}
.hpanel:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#6ff7ff12 0 1px,#0000 1px 4px);pointer-events:none}
.hpanel:after{content:"";position:absolute;left:0;right:0;height:26px;top:-30px;background:linear-gradient(#0000,#6ff7ff33,#0000);animation:scan 3s linear infinite;pointer-events:none}
@keyframes scan{to{top:110%}}
.hrow{display:flex;gap:8px;align-items:center}
.hrow canvas{width:118px;height:118px;flex:none}
.bars{flex:1;min-width:0}
.bar{display:flex;align-items:center;gap:5px;font-size:7px;margin:5px 0;text-shadow:0 0 6px #19d3e6}
.bar i{flex:1;height:8px;border:1px solid #6ff7ff88;position:relative;background:#6ff7ff14}
.bar i b{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);background:repeating-linear-gradient(90deg,var(--holo) 0 4px,#0000 4px 6px);box-shadow:0 0 8px var(--holo)}
.bar.key span:first-child{color:#fff}
.bar span:last-child{width:18px;text-align:right}
.hmeta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:7px;margin-top:8px;line-height:1.5;text-shadow:0 0 6px #19d3e6}
.hmeta b{color:#fff;font-weight:normal}
.holo{position:absolute;left:50%;top:-146px;width:150px;height:150px;margin-left:-75px;pointer-events:none;z-index:5;animation:rise .9s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{0%{transform:translateY(120px) scale(.2);opacity:0}100%{transform:none;opacity:1}}
.holo canvas{width:100%;height:100%;image-rendering:pixelated;filter:sepia(1) saturate(4) hue-rotate(150deg) brightness(1.35) drop-shadow(0 0 8px #4ff3ff);opacity:.85;animation:spin 5s ease-in-out infinite,flick 2.3s steps(1) infinite}
@keyframes spin{0%,100%{transform:scaleX(1) translateY(0)}25%{transform:scaleX(.15) translateY(-4px)}50%{transform:scaleX(-1) translateY(0)}75%{transform:scaleX(.15) translateY(-4px)}}
@keyframes flick{0%{opacity:.85}47%{opacity:.5}49%{opacity:.9}80%{opacity:.7}82%{opacity:.9}}
.holo:before{content:"";position:absolute;left:10px;right:10px;top:60px;height:100px;background:linear-gradient(180deg,#4ff3ff00,#4ff3ff44);clip-path:polygon(0 0,100% 0,62% 100%,38% 100%);z-index:-1}
.holo:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0b072455 0 2px,#0000 2px 5px);mix-blend-mode:multiply}
.r8 ~ .holo canvas,.holo.s8 canvas{filter:drop-shadow(0 0 10px #fff) saturate(1.6) brightness(1.2);animation:spin 5s ease-in-out infinite,flick 2.3s steps(1) infinite,huer 4s linear infinite}
@keyframes huer{to{filter:drop-shadow(0 0 10px #fff) saturate(1.6) brightness(1.2) hue-rotate(360deg)}}
.mclose{margin-top:14px;width:min(330px,88vw)}

/* ---------- squad ---------- */
.half{position:relative;aspect-ratio:5/4.9;border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);margin-bottom:12px;overflow:hidden;
  background:repeating-linear-gradient(0deg,#46d98a 0 25%,#3ccf80 25% 50%)}
.half:before{content:"";position:absolute;left:30%;right:30%;bottom:-3px;height:27%;border:3px solid #ffffffaa;border-radius:8px 8px 0 0}
.half:after{content:"";position:absolute;left:50%;top:-22%;width:44%;aspect-ratio:1;margin-left:-22%;border:3px solid #ffffffaa;border-radius:50%}
.slot{position:absolute;width:18%;margin-left:-9%;transform:translateY(-50%);z-index:2;text-align:center;cursor:pointer}
.slot .tk{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:12px;background:#17103f;overflow:hidden;position:relative;box-shadow:0 3px 0 #0006}
.slot .tk img{width:100%;height:100%;image-rendering:pixelated;display:block}
.slot .tk.empty{background:#ffffff55;border-style:dashed}
.slot .tk.empty:after{content:"+";font-family:var(--px);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.slot .lb{font-family:var(--px);font-size:7px;background:var(--ink);color:#fff;border-radius:6px;padding:3px 2px;margin-top:3px;white-space:nowrap;overflow:hidden}
.slot .lb.bad{background:#d6204f}
.slot.sel .tk{outline:4px solid var(--yel)}
.selbar{font-family:var(--px);font-size:8px;line-height:1.6;display:flex;gap:8px;align-items:center;min-height:44px}
.selbar .btn{width:auto;margin:0;padding:9px 8px;font-size:8px;flex:none}

.minis img{width:34px;height:34px;image-rendering:pixelated;background:#2c2380;border:2px solid var(--ink);border-radius:8px;animation:none!important;filter:none!important;transform:none!important}
.gcap{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--px);font-size:30px;color:var(--yel);text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--ink);pointer-events:none;display:none;line-height:1.3}
.gcap.on{display:block;animation:pop .5s}.gcap b{display:block;font-size:16px;color:#fff;text-shadow:3px 3px 0 var(--ink);font-weight:normal}.gcap i{display:block;font-style:normal;font-size:8px;color:#fff;text-shadow:2px 2px 0 var(--ink);margin-top:6px;padding:0 10px}
.bdg .cf{background:#ff8a1f;color:#fff}.bdg .fv{background:var(--pink);color:#fff}
.award{display:flex;gap:12px;align-items:center}.award img{width:72px;height:72px;image-rendering:pixelated;background:linear-gradient(#2c2380,#141042);border:3px solid var(--ink);border-radius:12px;flex:none}
.award .aw{font-family:var(--px);font-size:7px;color:var(--vio);margin-bottom:5px;line-height:1.5}.award b{font-size:17px}
.tow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.tow div{text-align:center;font-size:13px;line-height:1.2}.tow img{width:100%;aspect-ratio:1;image-rendering:pixelated;background:linear-gradient(#2c2380,#141042);border:2px solid var(--ink);border-radius:10px;display:block;margin-bottom:3px}
.hostline{display:flex;gap:10px;align-items:center}.hostline img{width:56px;height:56px;image-rendering:pixelated;background:#2c2380;border-radius:10px;flex:none}

/* ---------- 0.6: card finishes. The art stays pixel; the card itself is a smooth, glossy, light-catching object ---------- */
:root{--tx:0;--ty:0}
.card{--gx:calc(50% + var(--tx)*45%);--gy:calc(50% + var(--ty)*45%);--band:calc(50% + var(--tx)*38%)}
.card .fx:before,.card .fx:after{content:"";position:absolute;inset:0;pointer-events:none}
.r0,.r1,.r2,.r3,.r4,.r5,.r6{animation:none}
.r0{--fr:linear-gradient(160deg,#b9bfcc,#858c9e);--rc:#cfd6e6}
.r0 .in{background:linear-gradient(#2a2748,#191630)}
.r1{--fr:linear-gradient(160deg,#9be7ae,#2f9c5d);--rc:#8df0a8}
.r2{--fr:linear-gradient(160deg,#9fd6ff,#2b6fe0);--rc:#8fd0ff}
.r2 .fx:after{background:radial-gradient(circle at var(--gx) var(--gy),#ffffff30,#0000 48%)}
.r3{--fr:linear-gradient(150deg,#e6bfff,#8a3fe0 55%,#4a148c);--rc:#d9a3ff}
.r3 .fx:after{background:linear-gradient(115deg,#0000 calc(var(--band) - 14%),#ffffff66 var(--band),#0000 calc(var(--band) + 14%)),radial-gradient(circle at var(--gx) var(--gy),#ffffff2a,#0000 50%);mix-blend-mode:screen}
/* Star: gold foil */
.r4{--fr:linear-gradient(calc(115deg + var(--tx)*45deg),#7a4a00,#ffd95a 18%,#fff6c8 30%,#c98a00 46%,#ffe27a 62%,#8a5500 80%,#ffd95a);--rc:#ffe066;background-size:100% 100%}
.r4 .in{background:linear-gradient(#3b2c08,#151003)}
.r4 .fx{background:repeating-linear-gradient(92deg,#fff2 0 1px,#0000 1px 3px);mix-blend-mode:overlay}
.r4 .fx:after{background:linear-gradient(115deg,#0000 calc(var(--band) - 12%),#fff8d0aa var(--band),#0000 calc(var(--band) + 12%));mix-blend-mode:screen}
/* Rare: cut crystal */
.r5{--fr:conic-gradient(from calc(20deg + var(--tx)*60deg),#a8fbff,#fff,#ffb3f2,#9fc7ff,#fff,#b6fff0,#ffc9f6,#a8fbff);--rc:#b6fbff;background-size:100% 100%}
.r5 .in{background:linear-gradient(160deg,#16335c,#0a1230)}
.r5 .fx{animation:none;mix-blend-mode:screen;background:
  conic-gradient(from calc(200deg + var(--tx)*40deg) at 14% 12%,#ffffff66 0 9%,#0000 9% 18%,#bff7ff66 18% 27%,#0000 27% 100%),
  conic-gradient(from calc(20deg - var(--tx)*40deg) at 86% 88%,#ffd0f866 0 9%,#0000 9% 18%,#ffffff66 18% 27%,#0000 27% 100%),
  linear-gradient(calc(60deg + var(--ty)*30deg),#0000 30%,#9ff5ff33 45%,#0000 46%,#ffb3f233 60%,#0000 61%)}
.r5 .fx:after{background:linear-gradient(125deg,#0000 calc(var(--band) - 9%),#ffffffcc var(--band),#bff7ff66 calc(var(--band) + 4%),#0000 calc(var(--band) + 12%));mix-blend-mode:screen}
/* Ultra Rare: chrome mirror */
.r6{--fr:linear-gradient(calc(100deg + var(--tx)*70deg),#2d3340,#f4f6fa 14%,#6d7482 30%,#fff 47%,#4a5060 62%,#dfe4ee 80%,#2d3340);--rc:#f4f6fa;background-size:100% 100%}
.r6 .in{background:linear-gradient(#39404f,#12151c)}
.r6 .fx{animation:none;mix-blend-mode:overlay;background:linear-gradient(180deg,#cfeaff88 0,#ffffffcc calc(44% + var(--ty)*22%),#20263688 calc(47% + var(--ty)*22%),#0000 75%)}
.r6 .fx:after{background:linear-gradient(105deg,#0000 calc(var(--band) - 10%),#ffffffdd var(--band),#0000 calc(var(--band) + 10%));mix-blend-mode:screen}
/* Supernova: living fire */
.r7{--fr:linear-gradient(115deg,#ff3d00,#ffd21f,#fff,#ff7a00,#ff2d55,#ffd21f,#ff3d00);--rc:#ffb347;background-size:300% 300%;animation:slide 2.6s linear infinite;box-shadow:0 4px 0 #0009,0 0 14px #ff7a00aa}
.r7 .in{background:radial-gradient(circle at 50% 36%,#ffb347 0,#8a1c00 42%,#170404 80%)}
.r7 .fx{background:none;animation:none;mix-blend-mode:screen;opacity:1}
.r7 .fx:before{inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 44%,#fff3 0 3deg,#0000 3deg 11deg,#ffd21f33 11deg 13deg,#0000 13deg 20deg);animation:rot 14s linear infinite}
.r7 .fx:after{background:radial-gradient(circle at var(--gx) var(--gy),#fff7d066,#0000 45%)}
@keyframes rot{to{transform:rotate(360deg)}}
/* Cosmic: rainbow hologram foil over deep space */
.r8{--fr:linear-gradient(calc(115deg + var(--tx)*60deg),#ff4fd8,#4ff3ff,#fff34f,#4fff9a,#ff4fd8,#4ff3ff);--rc:#7ffcff;background-size:100% 100%;animation:none;box-shadow:0 4px 0 #0009,0 0 16px #7ffcffaa}
.r8 .in{background:radial-gradient(circle at 30% 20%,#2b1a6a,#05030f 72%)}
.r8 .art{background:radial-gradient(circle at 50% 40%,#ffffff33 0,#0000 60%),radial-gradient(1px 1px at 20% 30%,#fff,#0000),radial-gradient(1px 1px at 70% 20%,#fff,#0000),radial-gradient(1px 1px at 80% 70%,#fff,#0000),radial-gradient(1px 1px at 35% 82%,#fff,#0000),linear-gradient(#170f45,#05030f)}
.r8 .fx{animation:none;opacity:.8;mix-blend-mode:color-dodge;background:repeating-linear-gradient(calc(115deg + var(--tx)*50deg),#ff4fd877,#4ff3ff77 10%,#fff34f77 20%,#4fff9a77 30%,#ff4fd877 40%);background-size:220% 220%;background-position:calc(50% + var(--tx)*50%) calc(50% + var(--ty)*50%)}
.r8 .fx:after{background:radial-gradient(circle at var(--gx) var(--gy),#ffffff77,#0000 40%);mix-blend-mode:screen}
/* Quasar: black glass and twin jets of light */
.r9{--fr:linear-gradient(calc(115deg + var(--tx)*60deg),#001a3a,#19d3e6,#fff,#19d3e6,#001a3a,#7a2fd0,#001a3a);--rc:#9ff7ff;background-size:100% 100%;animation:none;box-shadow:0 4px 0 #0009,0 0 20px #19d3e6}
.r9 .in{background:linear-gradient(160deg,#020814,#000 60%,#07122a)}
.r9 .art{background:radial-gradient(circle at 50% 46%,#fff 0 3%,#9ff7ff 4%,#19d3e655 14%,#0000 40%),linear-gradient(#020814,#000)}
.r9 .fx{background:none;animation:none;mix-blend-mode:screen;opacity:1}
.r9 .fx:before{background:linear-gradient(calc(78deg + var(--tx)*14deg),#0000 44%,#7ffcff55 48%,#ffffffee 50%,#7ffcff55 52%,#0000 56%);animation:jet 1.8s ease-in-out infinite}
.r9 .fx:after{background:linear-gradient(160deg,#ffffff22 0 calc(22% + var(--ty)*14%),#0000 calc(23% + var(--ty)*14%)),radial-gradient(circle at var(--gx) var(--gy),#9ff7ff44,#0000 45%)}
@keyframes jet{0%,100%{opacity:.55}50%{opacity:1}}
/* Singularity: a black hole on a card */
.r10{--fr:linear-gradient(115deg,#000,#ff4fd8,#000,#4ff3ff,#000,#fff34f,#000);--rc:#fff;background-size:300% 300%;animation:slide 2.2s linear infinite;box-shadow:0 4px 0 #0009,0 0 26px #fff}
.r10 .in{background:#000}
.r10 .art{background:radial-gradient(circle at 50% 44%,#000 0 17%,#fff 18% 19%,#ffb347 21%,#ff4fd8 27%,#4ff3ff55 34%,#0000 46%),radial-gradient(1px 1px at 12% 20%,#fff,#0000),radial-gradient(1px 1px at 84% 16%,#fff,#0000),radial-gradient(1px 1px at 76% 84%,#fff,#0000),radial-gradient(1px 1px at 22% 78%,#fff,#0000),#000}
.r10 .fx{background:none;animation:none;mix-blend-mode:screen;opacity:1}
.r10 .fx:before{inset:-40%;background:conic-gradient(from 0deg at 50% 46%,#ff4fd8,#0000 12%,#4ff3ff 25%,#0000 37%,#fff34f 50%,#0000 62%,#fff 75%,#0000 87%,#ff4fd8);-webkit-mask:radial-gradient(circle at 50% 46%,#0000 0 16%,#000 22% 30%,#0000 44%);mask:radial-gradient(circle at 50% 46%,#0000 0 16%,#000 22% 30%,#0000 44%);animation:rot 5s linear infinite}
.r10 .fx:after{opacity:.5;mix-blend-mode:color-dodge;background:repeating-linear-gradient(calc(115deg + var(--tx)*60deg),#ff4fd855,#4ff3ff55 9%,#fff34f55 18%,#ff4fd855 27%);background-size:220% 220%;background-position:calc(50% + var(--tx)*60%) calc(50% + var(--ty)*60%)}
/* the big card leans with the light, and the hologram floats above it */
.bigwrap{perspective:900px}
.bigwrap .card.lg{transform:rotateY(calc(var(--tx)*9deg)) rotateX(calc(var(--ty)*-7deg));transition:transform .12s linear}
.holo{transform:translate(calc(var(--tx)*-16px),calc(var(--ty)*-10px));animation:rise .9s cubic-bezier(.2,1.3,.4,1)}
.holo canvas{filter:sepia(1) saturate(4) hue-rotate(150deg) brightness(1.4) drop-shadow(3px 0 0 #ff4fd866) drop-shadow(-3px 0 0 #4ff3ff88) drop-shadow(0 0 12px #4ff3ff);opacity:.9;animation:hfloat 3.6s ease-in-out infinite,flick 2.3s steps(1) infinite}
@keyframes hfloat{0%,100%{transform:translateY(0) rotateY(-24deg)}50%{transform:translateY(-8px) rotateY(24deg)}}
.holo:before{left:22px;right:22px;top:70px;height:92px;background:linear-gradient(180deg,#4ff3ff00,#4ff3ff66);filter:blur(2px)}
.holo.s8 canvas{filter:drop-shadow(3px 0 0 #ff4fd8aa) drop-shadow(-3px 0 0 #4ff3ffaa) drop-shadow(0 0 12px #fff) saturate(1.6) brightness(1.2);animation:hfloat 3.6s ease-in-out infinite,flick 2.3s steps(1) infinite}
.card.lg .hpanel{box-shadow:inset 0 0 0 1px #6ff7ff55,0 0 18px #19d3e633;backdrop-filter:blur(2px)}
/* ---------- 0.6: finger control ---------- */
.strike{z-index:32}.strike .cine{max-height:44vh}
.spad{flex:1;display:flex;flex-direction:column;padding:10px 12px 14px;min-height:0}
.tmeter{position:relative;height:26px;border:3px solid var(--ink);border-radius:13px;box-shadow:0 4px 0 var(--ink);background:linear-gradient(90deg,#ff2d55 0 7%,#ff8a1f 7% 18%,#8890a8 18% 31%,#7ffcff 31% 40%,#b6ff8f 40% 46%,#ffd21f 46% 54%,#b6ff8f 54% 60%,#7ffcff 60% 69%,#8890a8 69% 82%,#ff8a1f 82% 93%,#ff2d55 93%)}
.tmeter .needle{animation:none;left:50%}
.padwrap{position:relative;flex:1;min-height:150px;touch-action:none;margin-top:6px}
.padwrap .band{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.pball{position:absolute;left:50%;top:8px;width:92px;height:92px;margin-left:-46px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff,#dfe6f5 55%,#9aa6c4);border:4px solid var(--ink);box-shadow:0 8px 0 #0007,inset -8px -10px 0 #0001;cursor:grab}
.pball:before{content:"";position:absolute;inset:26%;border-radius:50%;background:#19d3e6;border:3px solid var(--ink)}
.pball .dot{display:none;position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#ff2d55;border:3px solid #fff;z-index:2}
.tapbig{position:absolute;inset:10px 20%;display:flex;align-items:center;justify-content:center;font-family:var(--px);font-size:26px;color:var(--ink);background:var(--yel);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink)}
.phint{color:#fff;font-size:14px;text-align:center;line-height:1.25;min-height:36px;margin:4px 0 8px}
.gradeb{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--px);font-size:26px;color:#fff;text-shadow:4px 4px 0 var(--ink);display:none;pointer-events:none}
.gradeb.on{display:block;animation:pop .4s}.gradeb.gPERFECT{color:var(--yel);text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--ink);font-size:32px}.gradeb.gSUPERB{color:#b6ff8f}.gradeb.gVERYGOOD{color:#7ffcff}.gradeb.gBAD{color:#ff8a1f}.gradeb.gMISKICK{color:#ff2d55}
.gcap i.wild{font-size:11px;color:var(--yel);animation:blink .3s steps(2) infinite}
/* ---------- 0.6: menu ---------- */
.stadp{position:relative;border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.stadp canvas{display:block;width:100%;aspect-ratio:192/80;image-rendering:pixelated}
.stl{position:absolute;left:0;right:0;bottom:0;background:#0b0724cc;color:#fff;font-family:var(--px);font-size:8px;padding:6px 8px;line-height:1.6}.stl span{display:block;font-size:6px;color:var(--yel)}
.bibirow{display:flex;gap:8px;align-items:center;cursor:pointer}
.bibirow canvas{width:64px;height:64px;image-rendering:pixelated;flex:none;background:#2c2380;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.bsay{flex:1;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font-size:15px;line-height:1.25;box-shadow:0 4px 0 var(--ink)}.bsay small{display:block;font-family:var(--px);font-size:6px;color:#8a82b8;margin-top:5px}
.sc.dropon{outline:4px solid var(--yel);outline-offset:2px;border-radius:10px}

/* ---------- 0.7: turn the card over, neon edges ---------- */
.bigwrap{--ry:0deg}
.bigwrap .card.lg{transform:rotateY(calc(var(--ry) + var(--tx)*9deg)) rotateX(calc(var(--ty)*-7deg));transition:none}
.bigwrap.snap .card.lg{transition:transform .4s cubic-bezier(.2,1.25,.4,1)}
.bigwrap .card.lg.cardback{position:absolute;inset:0;transform:rotateY(calc(var(--ry) + 180deg + var(--tx)*9deg)) rotateX(calc(var(--ty)*-7deg));visibility:hidden}
.bigwrap.back .card.lg.cardback{visibility:visible}.bigwrap.back #bigcard{visibility:hidden}.bigwrap.back .holo{opacity:0}
.cardback .in{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:14px}
.cardback .bkc{width:96px;height:96px;image-rendering:pixelated}
.bk1{font-size:26px;color:var(--yel);text-shadow:3px 3px 0 var(--pink),6px 6px 0 #000}.bk2{font-size:34px;color:#7ffcff;text-shadow:3px 3px 0 #6a4dff,6px 6px 0 #000;margin-top:-2px}
.bks{font-family:var(--bd);font-size:26px;letter-spacing:6px;margin:10px 0;background:linear-gradient(calc(100deg + var(--tx)*90deg),var(--rc),#fff,var(--rc),#0000 70%,var(--rc));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;background-position:calc(50% + var(--tx)*50%) 0}
.bkt{font-size:17px;color:var(--rc);letter-spacing:2px;text-shadow:0 0 12px var(--rc)}.bkn{font-size:6px;line-height:1.8;color:#fff9;margin-top:10px}
.card.lg.r5,.card.lg.r6{box-shadow:0 4px 0 #0009,0 0 0 2px var(--rc),0 0 22px var(--rc)}
.card.lg.r7,.card.lg.r8,.card.lg.r9,.card.lg.r10{animation-name:slide,neon;animation-duration:2.6s,1.8s;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite}
.card.lg.r8,.card.lg.r9{animation-name:neon;animation-duration:1.8s}
@keyframes neon{0%,100%{box-shadow:0 4px 0 #0009,0 0 0 2px var(--rc),0 0 18px var(--rc),0 0 44px var(--rc)}50%{box-shadow:0 4px 0 #0009,0 0 0 3px #fff,0 0 30px var(--rc),0 0 80px var(--rc)}}
.gcap.sm{font-size:20px;top:36%}.gradeb i{display:block;font-style:normal;font-size:10px;color:#fff;text-shadow:2px 2px 0 var(--ink);margin-top:8px}
.vc{color:var(--yel);cursor:pointer;white-space:nowrap}

/* ---------- 0.8 ---------- */
.fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.callout{position:absolute;left:0;right:0;top:54%;text-align:center;font-family:var(--px);font-size:15px;line-height:1.4;color:#fff;text-shadow:3px 3px 0 var(--ink);display:none;pointer-events:none;padding:0 8px}
.callout.on{display:block;animation:callin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes callin{0%{transform:scale(3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.callout.l1{color:#7ffcff}.callout.l2{color:var(--yel);font-size:17px;text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--ink)}
.callout.l3{color:#ffb347;font-size:19px;text-shadow:3px 3px 0 #ff2d55,6px 6px 0 var(--ink);animation:callin .5s cubic-bezier(.2,1.6,.4,1),blink .25s steps(2) 4}
.callout.l4{font-size:22px;background:linear-gradient(90deg,#ff4fd8,#4ff3ff,#fff34f,#4fff9a,#ff4fd8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(3px 3px 0 #150d33);animation:callin .5s cubic-bezier(.2,1.6,.4,1),slide 1.2s linear infinite}

/* ---------- 0.9: the commentary gantry ---------- */
.studio{position:absolute;right:0;top:15%;width:74%;border:3px solid var(--ink);border-right:0;border-radius:12px 0 0 12px;overflow:hidden;box-shadow:-4px 4px 0 #0008;transform:translateX(108%);transition:transform .5s cubic-bezier(.2,1.2,.3,1);pointer-events:none;background:#070418;z-index:4}
.studio.on{transform:none}
.studio canvas{display:block;width:100%;image-rendering:pixelated}
.studio .stl2{position:absolute;left:6px;top:4px;font-family:var(--px);font-size:6px;color:var(--yel);background:#0b0724cc;padding:3px 5px;border-radius:5px;font-weight:normal}
.studio img{position:absolute;bottom:22%;width:27%;image-rendering:pixelated;transition:transform .2s}
.studio img.c0{left:7%}.studio img.c1{right:7%}
.studio img.talk{transform:translateY(-6%) scale(1.12)}.studio img.c0.talk{animation:shake .18s linear infinite}
@keyframes shake{0%{margin-left:-2px}50%{margin-left:2px}100%{margin-left:-2px}}
.sbub{position:absolute;left:4%;right:4%;bottom:3%;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:4px 8px;font-size:13px;line-height:1.2;min-height:34px}
.sbub i{display:block;font-family:var(--px);font-style:normal;font-size:6px;color:#d6204f;margin-bottom:2px}.sbub.s1 i{color:#7a2fd0}.sbub.s0{font-weight:700}
.bdg u.sh{background:#7ffcff;color:#150d33}.bdg u.dz{background:#ff8a1f;color:#150d33}

<body>
<div id="bg"><canvas id="stars" width="120" height="260"></canvas></div>
<div id="app"></div>
<div id="modal"></div>
<div id="flash"></div>
<script>
'use strict';
/* =====================================================================
   COMET CUP — development build
   1. core: random numbers, data tables, card generator, save game
   ===================================================================== */
const VERSION = '0.14 dev';
function rngFrom(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
function wpick(r,arr,wf){let t=0;for(const a of arr)t+=wf(a);let x=r()*t;for(const a of arr){x-=wf(a);if(x<=0)return a}return arr[arr.length-1]}
const gauss=r=>(r()+r()+r()+r()-2)*1.73;           // roughly normal, sd 1
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=amt<0?0:255,p=Math.abs(amt);
  r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
function lum(hex){const n=parseInt(hex.slice(1),16);return((n>>16)*.299+(n>>8&255)*.587+(n&255)*.114)/255}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- positions, stats, rarity ---------- */

const BAD_SUB=['fuck','shit','cunt','bitch','wank','bastard','bollock','slut','whore','nigg','penis','vagina','porn','nazi','hitler','piss','twat','prick','retard','spaz'];

function checkName(raw){
  const name=raw.trim().replace(/\s+/g,' ');
  if(name.length<3)return{ok:false,why:'A bit short! Try 3 letters or more.'};
  if(name.length>16)return{ok:false,why:'Too long! 16 letters at most.'};
  if(!/^[A-Za-z0-9 ]+$/.test(name))return{ok:false,why:'Letters and numbers only, please.'};
  const leet=name.toLowerCase().replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/7/g,'t').replace(/8/g,'b');
  const flat=leet.replace(/[^a-z]/g,''),squash=flat.replace(/(.)\1+/g,'$1');

const OUTLINE='#150d33';
function drawLook(L,kt,ex){

function M_new(o){if(o.ref==null)o.ref=((o.seed||0)>>>3)%3;

  for(const side of[0,1]){const t=o.teams[side];FORMS[t.form].forEach((s,i)=>{const c=t.cards[i];if(!c)return;
    M.P.push({i:M.P.length,side,card:c,role:s[0],hx:side?4-s[1]:s[1],hy:side?8-s[2]:s[2],x:0,y:0,acted:false,down:false,out:false,sta:100,knock:0,conf:0,rep:(t.rep&&t.rep[c.seed])||0,fav:!!(t.fav&&t.fav.has(c.seed)),sp:c.special?c.special.uses:0})})}

function say(M,s,k){M.log.push({s,k:k||'',t:M.turnNo})}

const ref=p=>p?{i:p.i,card:p.card,side:p.side,sta:p.sta,knock:p.knock,x:p.x,y:p.y}:null;
const REFS=[{seed:909090,n:'Pao “Blinky” Modumi',see:-.13,red:-.15,d:'Kind, sleepy and easily distracted. Misses more than most and hates sending anyone off.'},
  {seed:31,n:'Zizz Honeywhistle',see:0,red:0,d:'By the book. Loves the whistle, loves a free kick, fair to everyone.'},
  {seed:195,n:'Madam Cinder Vash',see:.12,red:.25,d:'Sees everything. Quick with the red card. Players behave when she is in charge.'}];
const REF={i:-1,side:2,sta:100,knock:0,x:0,y:0,k:0,get card(){const r=REFS[this.k]||REFS[0];return r.card||(r.card=Object.assign({},genCard(r.seed,1,0),{name:r.n}))}};   // the referee
function begin(M,type,x){M.cur=Object.assign({type,stages:[],turn:M.turnNo,snap:M.P.map(p=>({i:p.i,card:p.card,side:p.side,x:p.x,y:p.y,role:p.role,down:p.down,out:p.out}))},x||{})}
function stage(M,t,a,b,la,lb,pa,win,txt,extra){if(M.cur)M.cur.stages.push(Object.assign({t,a:ref(a),b:ref(b),la,lb,pa,win,txt},extra||{}))}
function end(M){const e=M.cur;M.cur=null;if(!e||!e.stages.length)return;M.ev.push(e);if(e.goal||e.special)M.hl.push(e);
  if(e.wow){const late=e.turn>=M.max-6&&Math.abs(M.score[0]-M.score[1])<=1?18:0;e.wow+=late;const k=e.goal?'bestGoal':'bestPlay';if(!M[k]||e.wow>M[k].wow)M[k]=e}}
function M_reset(M){for(const p of M.P){p.x=p.hx;p.y=p.hy;p.acted=false;p.down=false;p.dz=0}M.streak=0;M.lastPass=null}
function wake(M,side){for(const p of M.P)if(p.side===side){p.acted=false;if(p.dz>0)p.dz--;else p.down=false}}
function striker(M,side){const c=M.P.filter(p=>!p.out&&p.side===side&&p.role!=='GK');return c.find(p=>p.role==='ATK')||c[c.length-1]||M.P.find(p=>p.side===side&&!p.out)}
function M_kick(M,side){
  const a=striker(M,0),b=striker(M,1);let w;
  if(side==null){const A=eff(M,a,'SPD')*.5+eff(M,a,'STR')*.3+eff(M,a,'SKL')*.2,B=eff(M,b,'SPD')*.5+eff(M,b,'STR')*.3+eff(M,b,'SKL')*.2,pa=lg((A-B)/12);
    w=M.rnd()<pa?a:b;say(M,`Kick-off! ${nm(a)} and ${nm(b)} race for the ball… ${nm(w)} gets there first!`);
    begin(M,'kick');stage(M,'KICK-OFF!',a,b,'PACE '+Math.round(A),'PACE '+Math.round(B),pa,w===a?'a':'b',`${nm(w)} wins the race to the ball!`,{k:'kick'});end(M)}

function fatigue(p){return p.sta<30?2:p.sta<60?1:0}
function eff(M,p,st){let v=p.card.stats[st];const nat=p.card.pos;
  if(nat!==p.role){const near=(nat==='MID'&&p.role==='WNG')||(nat==='WNG'&&p.role==='MID');v*=near?.95:.88}
  if(M.o.homeSide===p.side)v+=3;if(M.o.mods&&M.o.mods[st])v+=M.o.mods[st];
  v-=[0,5,12][fatigue(p)];if(p.knock>0)v-=8;v+=p.conf*2+(p.rep||0);if(p.fav&&M.o.homeSide===p.side)v+=2;return v}
function reach(M,p){const s=eff(M,p,'SPD');return s>=72?3:s<35?1:2}   // fast players cover more ground
function tire(p,k){p.sta=Math.max(0,p.sta-COST[k])}
function at(M,x,y){return M.P.find(p=>!p.out&&p.x===x&&p.y===y)}
function oppAdj(M,side,x,y,exc){return M.P.filter(p=>!p.out&&p.side!==side&&p.role!=='GK'&&!p.down&&p!==exc&&cheb(p.x,p.y,x,y)===1)}
function lineSq(x0,y0,x1,y1){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0)),out=[];for(let i=1;i<n;i++)out.push([Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n)]);return out}
// opponents on a ball's path ("on") or one square beside it ("near"). Beside only counts with time to react: 2+ squares from the kicker.
function inPath(M,a,tx,ty){const sq=lineSq(a.x,a.y,tx,ty),res=[];
  for(const o of M.P){if(o.out||o.side===a.side||o.down||o.role==='GK')continue;let on=false,near=false;
    for(const[x,y]of sq){const dd=cheb(o.x,o.y,x,y);if(dd===0)on=true;else if(dd===1)near=true}
    const far=cheb(o.x,o.y,a.x,a.y);if(on)res.push({o,on:true,far});else if(near&&far>=2)res.push({o,on:false,far})}
  return res.sort((p,q)=>p.far-q.far)}

/* --- the contests. Each gives a chance from 0 to 1; luck decides the rest. --- */
function dribNums(M,c,d,v){const C=M.o.cond;let A,B,la,lb;
  if(v==='burst'){A=eff(M,c,'SPD')*.8+eff(M,c,'SKL')*.2;B=eff(M,d,'SPD')*.5+eff(M,d,'TCK')*.5;la='SPEED';lb='REACTIONS'}
  else if(v==='barge'){A=eff(M,c,'STR')*.8+eff(M,c,'SKL')*.2;B=eff(M,d,'STR')*.7+eff(M,d,'TCK')*.3;la='STRENGTH';lb='STRENGTH'}
  else{A=eff(M,c,'SKL')*.7+eff(M,c,'SPD')*.3;B=eff(M,d,'TCK')*.6+eff(M,d,'STR')*.4;la='SKILL';lb='TACKLING'}
  const sup=oppAdj(M,c.side,d.x,d.y,d).length;A+=-8*M.streak+(C.drb||0);B+=10*sup+(C.tck||0);
  return{A,B,la,lb,sup,p:d.down?.97:clamp(lg((A-B)/14),.05,.95)}}
/* How brilliant was that? Mostly it is how hard the thing was for ANYONE (distance, defenders beaten, the keeper in the way),
   plus how well it was struck and how good the player is. Pure luck (a weak player fluking it) counts for very little. */
function brill(p,o){const g={PERFECT:10,SUPERB:6,'VERY GOOD':3}[o.ctl&&o.ctl.grade]||0;
  return o.base+42*o.diff+9*(o.d||0)+9*(o.beat||0)+13*(o.streak||0)+(o.sp?6:0)+g+(o.ctl?o.ctl.pow*5:0)+(p.card.ovr-55)*.45+8*(o.un||0)}
let WILD=140,WILD_PLAY=74;   // above this the crowd goes wild, and (online) the moment is sent in for Goal or Play of the Week
/* Stopping tackle ping-pong (tested on 900 simulated matches per rule set):
   - the player who wins a tackle shields the ball through the opponents' next turn: only ONE challenge may be made on him, at -20;
   - a player robbed by a standing tackle is off balance and misses his side's next turn;
   - a player robbed by a slide tackle is on the floor: he misses his side's next turn and is still down for the turn after that. */
let TKR={daze:14,stun:1,knock:1,shield:20,one:1};
function tackNums(M,t,c,v,lunge){const C=M.o.cond;   // anyone can win a tackle; defenders are simply better at it
  let A=eff(M,t,'TCK')*.45+eff(M,t,'STR')*.25+eff(M,t,'SPD')*.3+(C.tck||0)-(lunge?8:0)-(t.dazed===M.turnNo?TKR.daze:0)-(c.shield===M.turnNo?TKR.shield:0)+(v==='slide'?10:v==='stackle'?25:0);

  return{A,B,p:clamp(lg((A-B)/15),.08,.95)}}
// Passing. Ground passes are cut out along their path. Lobs clear the path but can be won in the air near where they land.
// Either kind can go astray (worse with distance and poor passers), and a marked or clumsy receiver can spill it.
function passInfo(M,a,b,v,ctl,pen){const C=M.o.cond,d=cheb(a.x,a.y,b.x,b.y),pas=eff(M,a,'PAS');
  if(v==='spass')return{miss:0,risks:[],fumble:0,ok:1,d,mk:0};
  let miss=clamp(.02+d*.025-(pas-50)/350-(C.pas||0)/100+(v==='lob'?.03:0),.01,.45);const risks=[];
  if(pen)miss+=pen;

  if(v==='lob'){for(const o of M.P){if(o.out||o.side===a.side||o.down||o.role==='GK')continue;const r=cheb(o.x,o.y,b.x,b.y);if(r<1||r>2)continue;
      const q=eff(M,o,'TCK')*.4+eff(M,o,'SPD')*.2+(o.card.ht-175)*.25-pas*.6;risks.push({o,on:r===1,lob:true,p:clamp((r===1?.24:.05)+q/150,.02,.7)})}

  if(ctl)for(const r of risks)r.p=clamp(r.p*(ctl.wt<.85?1.3:1)*(1-.35*(ctl.pow-.5))*(1-.3*Math.abs(ctl.sx))*(ctl.tq>0?1-.2*ctl.tq:1),.01,.85);

function pCharge(M,p,q){return clamp(lg((eff(M,p,'STR')*.6+eff(M,p,'SPD')*.4-eff(M,q,'STR')*.6-eff(M,q,'SKL')*.4)/12),.08,.92)}
function goalOf(side){return side===0?[2,0]:[2,8]}
function canShoot(M,c){const[gx,gy]=goalOf(c.side);return c.role!=='GK'&&cheb(c.x,c.y,gx,gy)<=5}
function shotInfo(M,c,v,ctl,adj){const[gx,gy]=goalOf(c.side),gk=at(M,gx,gy),d=cheb(c.x,c.y,gx,gy),C=M.o.cond,sht=eff(M,c,'SHT'),blocks=[];

  let A=v==='power'?sht*.6+eff(M,c,'STR')*.4+8-7.5*(d-1):v==='sshot'?sht+16-3*(d-1):sht-6*(d-1);
  const press=oppAdj(M,c.side,c.x,c.y).length;A+=-3*press+(C.sht||0)+(adj||0);

/* A lofted pass that arrives in the air can be met first time. What is possible depends on the height it arrives at (head or volley)
   and on where the goal is compared with the way the ball is travelling: towards goal is a volley or glancing header,
   across is a scissor kick, and with the goal behind the ball's flight it has to be an overhead kick or a back header. */
const AIRADJ={header:-5,'glancing header':-3,'back header':-11,volley:-2,'scissor kick':-8,'overhead kick':-13},AIRWOW={header:4,'glancing header':5,'back header':12,volley:8,'scissor kick':15,'overhead kick':26};
function airOptions(M){const a=M.air;if(!a||M.over||M.ap<=0)return[];const p=M.P[a.i];if(M.P[M.ball]!==p||p.side!==M.turn||p.acted)return[];
  const o=[{t:'ctrl',x:p.x,y:p.y,p:1}],tx=p.x-a.from[0],ty=p.y-a.from[1],tl=Math.hypot(tx,ty)||1;

  for(const q of M.P){if(q.out||q.side!==p.side||q===p||q.role==='GK'||cheb(p.x,p.y,q.x,q.y)>2||(q.x-p.x)*tx+(q.y-p.y)*ty<0)continue;o.push({t:'pass',v:'ground',fl:a.zone==='head'?'header':'volley',q,x:q.x,y:q.y,p:passInfo(M,p,q,'ground',null,.1).ok})}

/* --- what a player may do this turn. Several choices can share one target square. --- */
function options(M,p){
  const o=[];if(M.over||p.out||p.acted||p.side!==M.turn||p.down||p.stun===M.turnNo||M.ap<=0)return o;
  const c=M.P[M.ball],sp=p.sp>0&&p.card.special?p.card.special:null;
  if(c===p){
    if(p.role!=='GK')for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){if(!dx&&!dy)continue;const x=p.x+dx,y=p.y+dy;
      if(x<0||x>4||y<0||y>8||isGoalSq(x,y))continue;const q=at(M,x,y);
      if(!q){o.push({t:'run',x,y});const x2=x+dx,y2=y+dy;if(reach(M,p)>=3&&x2>=0&&x2<=4&&y2>=0&&y2<=8&&!isGoalSq(x2,y2)&&!at(M,x2,y2))o.push({t:'run',x:x2,y:y2,far:true})}
      else if(q.side!==p.side)for(const v of['trick','burst','barge'])o.push({t:'drib',v,x,y,q,p:dribNums(M,p,q,v).p})}
    for(const q of M.P)if(!q.out&&q.side===p.side&&q!==p){
      o.push({t:'pass',v:'ground',x:q.x,y:q.y,q,p:passInfo(M,p,q,'ground').ok});
      if(cheb(p.x,p.y,q.x,q.y)>=2)o.push({t:'pass',v:'lob',x:q.x,y:q.y,q,p:passInfo(M,p,q,'lob').ok});
      if(sp&&sp.type==='pass')o.push({t:'pass',v:'spass',x:q.x,y:q.y,q,p:1,sp:true})}
    if(canShoot(M,p)){const[gx,gy]=goalOf(p.side);for(const v of['placed','power'])o.push({t:'shoot',v,x:gx,y:gy,p:shotInfo(M,p,v).p});
      if(sp&&sp.type==='shot')o.push({t:'shoot',v:'sshot',x:gx,y:gy,p:shotInfo(M,p,'sshot').p,sp:true})}
  }else if(p.role!=='GK'){
    const rg=reach(M,p);for(let dx=-rg;dx<=rg;dx++)for(let dy=-rg;dy<=rg;dy++){if(!dx&&!dy)continue;const x=p.x+dx,y=p.y+dy;
      if(x<0||x>4||y<0||y>8||isGoalSq(x,y)||at(M,x,y))continue;o.push({t:'move',x,y})}
    for(const q of M.P)if(!q.out&&q.side!==p.side&&q!==c&&q.role!=='GK'&&!q.down&&cheb(p.x,p.y,q.x,q.y)===1)o.push({t:'charge',v:'charge',x:q.x,y:q.y,q,p:pCharge(M,p,q)});
    if(c.side!==p.side&&c.role!=='GK'&&!(c.shield===M.turnNo&&TKR.one&&M.shTry>=1)){const d=cheb(p.x,p.y,c.x,c.y);let via=null;
      if(d===2)for(let dx=-1;dx<=1&&!via;dx++)for(let dy=-1;dy<=1&&!via;dy++){const x=p.x+dx,y=p.y+dy;if(x<0||x>4||y<0||y>8||isGoalSq(x,y)||at(M,x,y))continue;if(cheb(x,y,c.x,c.y)===1)via=[x,y]}
      if(d===1||via){const lunge=d===2;
        if(!lunge)o.push({t:'tackle',v:'stand',x:c.x,y:c.y,q:c,p:tackNums(M,p,c,'stand',false).p});
        o.push({t:'tackle',v:'slide',x:c.x,y:c.y,q:c,lunge,via,p:tackNums(M,p,c,'slide',lunge).p});
        if(sp&&sp.type==='tackle')o.push({t:'tackle',v:'stackle',x:c.x,y:c.y,q:c,lunge,via,p:tackNums(M,p,c,'stackle',lunge).p,sp:true});
        if(!lunge&&M.ap>=2){const mate=M.P.filter(z=>z!==p&&!z.out&&z.side===p.side&&!z.acted&&!z.down&&z.role!=='GK'&&cheb(z.x,z.y,c.x,c.y)===1).sort((y,z)=>tackNums(M,z,c,'stand',false).p-tackNums(M,y,c,'stand',false).p)[0];
          if(mate){const p1=tackNums(M,p,c,'stand',false).p,p2=tackNums(M,mate,c,'stand',false).p;o.push({t:'tackle',v:'team',x:c.x,y:c.y,q:c,mate,p:clamp(1-(1-p1)*(1-p2)*.85,.05,.97)})}}}}
  }
  return o;
}
function opLabel(p,op){return op.sp?'★ '+p.card.special.name.toUpperCase():VLABEL[op.v]||op.t.toUpperCase()}
function injure(M,v){

  const t=M.o.teams[v.side],sub=(t.bench||[]).find(c=>!M.used.has(c));say(M,`Ouch! ${nm(v)} has ${what} and has to come off.`,'inj');

function aiAct(M){

  const mine=M.P.filter(p=>!p.out&&p.side===side&&!p.acted&&!p.down);
  const adv=(y)=>side===0?8-y:y;

  const shotAt=(p,x,y)=>{const ox=p.x,oy=p.y;p.x=x;p.y=y;const v=canShoot(M,p)?shotInfo(M,p,'placed').p:0;p.x=ox;p.y=oy;return v};
  if(c.side===side){
    if(!c.acted)for(const op of options(M,c)){
      if(op.t==='shoot')consider(c,op,(op.p>=.24||M.turnNo>=M.max-2)?55+op.p*100:op.p*60-(op.sp?20:0));
      else if(op.t==='pass'){const q=op.q,gain=adv(q.y)-adv(c.y);let sc=gain*9+(q.acted?0:shotAt(q,q.x,q.y)*70)-(1-op.p)*75-oppAdj(M,side,q.x,q.y).length*4-(op.sp?(op.p-passInfo(M,c,q,'ground').ok<.2?40:0):0);if(c.role==='GK')sc+=40;if(q.role==='GK')sc-=30;consider(c,op,sc)}

      for(const op of options(M,p)){if(op.t!=='move'||adv(op.y)>lim)continue;const gain=adv(op.y)-adv(p.y);
        const crowd=M.P.filter(q=>!q.out&&q.side===side&&q!==p&&cheb(q.x,q.y,op.x,op.y)<=1).length;
        consider(p,op,gain*4-oppAdj(M,side,op.x,op.y).length*3-crowd*3-7+(p.role==='ATK'?3:0))}}

  }

    for(const op of options(M,p)){

}

  clearInterval(liveTimer);liveTimer=setInterval(()=>frame(performance.now()),60);frame(performance.now());
  setTimeout(()=>modal.querySelectorAll('.bar b').forEach(b=>b.style.width=b.dataset.w+'%'),60);
  const big=document.getElementById('bigcard');

  sfx.flip(card.rar);
}

function setTilt(x,y){if(Math.abs(x-TILT.x)<.01&&Math.abs(y-TILT.y)<.01)return;TILT.x=x;TILT.y=y;const st=document.documentElement.style;st.setProperty('--tx',x.toFixed(3));st.setProperty('--ty',y.toFixed(3))}

function fitScore(card,role){if(card.pos===role)return card.ovr;const near=(card.pos==='MID'&&role==='WNG')||(card.pos==='WNG'&&role==='MID');let o=0;const w=PROFILE[role].w;for(const k in w)o+=card.stats[k]*w[k];return Math.round(o*(near?.95:.88))}

  f.forEach((s,i)=>{let b=null,bs=-1;for(const r of free){if(slots.includes(r.id))continue;const sc=fitScore(cardOf(r),s[0]);if(sc>bs){bs=sc;b=r}}slots[i]=b?b.id:null});S.lineup.slots=slots}

VIEWS.how=()=>`<div class="screen">${top_('HOW TO PLAY')}<div class="panel"><ol class="how">
  <li>Two teams of six: a goalkeeper and five outfield players. You shoot at the <b>top</b> goal.</li>
  <li>On your turn you get <b>2 actions</b>. Each player can act once per turn. Tap a player then a square, or <b>drag</b> the player there.</li>
  <li><b>With the ball:</b> run to a white square, pass to a team-mate, take on a red opponent, or shoot at the yellow goal.</li>
  <li><b>Choose how.</b> When there is more than one way to do it you pick: Trick, Burst or Barge to beat a player; ground pass or lob; placed or power shot; standing or slide tackle.</li>
  <li><b>Close-ups.</b> Every contest zooms in on the players involved. Their stats build the odds and then luck has its say.</li>
  <li><b>Ground passes</b> can go astray, more so over distance. A player standing on the ball's path can cut it out. A player beside the path can only reach it if the ball has travelled far enough to give them time.</li>
  <li><b>Lobs</b> float over everyone on the way, but defenders next to the receiver can jump and win them, and good defenders can even get across from two squares away. A marked receiver may spill the ball.</li>
  <li><b>Speed matters.</b> Fast players (Speed 72 or more) can move three squares and run two with the ball. Very slow ones move one.</li>
  <li><b>Double tackle.</b> With two of your players next to the ball carrier, they can go in together for one much better chance. It uses both actions.</li>
  <li><b>Confidence.</b> A scorer plays a little better for the rest of the match, and a fan favourite gets a small lift at home.</li>
  <li><b>Off the ball</b> you can shoulder-charge a nearby opponent to knock them down for a turn. If the referee sees it, it is a free kick. Hurt someone and it can be a red card, and a sent-off player is not replaced.</li>
  <li><b>Shots</b> get harder with every square of distance, and anyone in the way may block.</li>
  <li><b>Beating players</b> gets harder each time in a row, and much harder when defenders stand side by side.</li>
  <li><b>Stamina.</b> Everything costs energy. Tired players (yellow bar) play worse, exhausted ones (red) much worse. Leave a player alone for a turn and they recover.</li>
  <li><b>Star players</b> (Star tier and above) have a special move, marked ★, that they can use once, twice or three times a match.</li>
  <li>Knocks slow a player for a few turns. A real injury means a substitute and some hours or days out.</li></ol></div>
  <div class="panel small"><b>Stats</b><br>SPD speed · STR strength · SKL ball skill · PAS passing · SHT shooting · TCK tackling · KEP goalkeeping.<br>A player out of position plays a little worse.</div></div>`;

const TIERS=['Backyard League','Moon Park League','Asteroid Belt League','Ring Road League','Nebula League','Pulsar Premier','Quasar Elite','Galaxy Masters','Supercluster League','Comet Cup Championship'];
const TN_A=['Turbo','Moonbeam','Galaxy','Nebula','Saturn','Pluto','Quasar','Asteroid','Cosmic','Rocket','Stardust','Lunar','Solar','Meteor','Jelly','Neon','Pixel','Mango','Bubble','Thunder'];
const TN_B=['Tanuki','Mochi','Gyoza','Newts','Slammers','Puddings','Queens','Otters','Dumplings','Koi','Ramen','Pandas','Sprouts','Yokai','Rockets','Noodles','Beetles','Foxes','Wizards','Kappa'];
const TCOL=['#ff3b6b','#ff8a1f','#ffd21f','#7ddc1f','#17c964','#12c9c9','#2b8cff','#6a4dff','#c14dff','#ff5fd2','#ffffff','#22223a'];
const STAD=['Dome','Bowl','Arena','Park','Ring','Gardens','Crater','Turbodrome'];
function newLeague(tier,season){
  const r=rngFrom(hashStr(S.team.name)+tier*101+season*7919),teams=[{id:0,you:true}],used={};
  while(teams.length<8){const a=pick(r,TN_A),b=pick(r,TN_B);if(used[b]||used[a])continue;used[a]=used[b]=1;let c1=pick(r,TCOL),c2=pick(r,TCOL);if(c1===c2)c2=c1==='#ffffff'?'#22223a':'#ffffff';
    teams.push({id:teams.length,name:a+' '+b,c1,c2,stad:b+' '+pick(r,STAD),cond:ri(r,0,6),biome:ri(r,0,9),sky:ri(r,0,5),seed:(r()*4294967296)>>>0,level:Math.max(0,(tier-1)*.95+r()*1.4-.4),fans:Math.round(100*Math.pow(1.9,tier)*(.6+r()))})}
  // round robin: 7 rounds of 4 matches. First id in a pair plays at home.
  const ids=[0,1,2,3,4,5,6,7],rounds=[];
  for(let k=0;k<7;k++){const rd=[];for(let i=0;i<4;i++){const a=ids[i],b=ids[7-i];rd.push((k+i)%2?[a,b]:[b,a])}rounds.push(rd);ids.splice(1,0,ids.pop())}
  const table={};for(let i=0;i<8;i++)table[i]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  return{tier,season,round:0,teams,rounds,table,scorers:{},last:[],pstats:{},week:null,sGoal:null,sPlay:null};
}
function teamInfo(id){const L=S.league;if(id===0)return{name:S.team.name,c1:S.team.c1,c2:S.team.c2,stad:S.team.stadium,cond:S.team.cond,biome:S.team.biome,sky:S.team.sky,fans:S.fans,cap:capacity()};const t=L.teams[id];return Object.assign({cap:Math.max(600,t.fans*1.2)},t)}
function standings(){const L=S.league;return Object.keys(L.table).map(k=>Object.assign({id:+k},L.table[k])).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.id-b.id)}
function myPos(){return standings().findIndex(t=>t.id===0)+1}
function record(L,a,b,ga,gb){const A=L.table[a],B=L.table[b];A.p++;B.p++;A.gf+=ga;A.ga+=gb;B.gf+=gb;B.ga+=ga;if(ga>gb){A.w++;B.l++;A.pts+=3}else if(ga<gb){B.w++;A.l++;B.pts+=3}else{A.d++;B.d++;A.pts++;B.pts++}}
function addScorers(L,M,ids){for(const g of M.goals){const k=g.name+'|'+ids[g.side];L.scorers[k]=(L.scorers[k]||0)+1}}

const UPG={
  stands:{n:'Bigger Stands',d:'More seats, more ticket money, more noise.',max:6},
  store:{n:'Megastore',d:'Each level adds 50% to merchandise income.',max:5},
  medic:{n:'Medical Bay',d:'Injured players return 15% sooner per level.',max:4},
  train:{n:'Training Pod',d:'Players get their breath back faster in matches.',max:4}};
const capacity=()=>300*Math.pow(2,S.club.stands);
const upCost=k=>Math.round(600*Math.pow(2.3,S.club[k])/50)*50;
function income(home,ev){const att=Math.min(S.fans,capacity());return{att,tickets:Math.round(att*.15*(home?1:.25)),merch:Math.round(S.fans*.04*(1+S.club.store*.5)*(ev.merch||1))}}
function fanNickname(){const r=S.rec,n=r.w+r.d+r.l;if(n<3)return'';const gpg=r.gf/n,cpg=r.ga/n;
  if(S.titles>0)return'The Champions';if(r.streak>=3)return'The Unstoppables';if(gpg>=2.4)return'The Goal Machines';if(cpg<=.6)return'The Iron Curtain';if(r.d>=r.w&&r.d>=r.l)return'The Nail-Biters';if(r.l>r.w+1)return'The Lovable Underdogs';if(gpg>=1.6)return'The Entertainers';return'The Battlers'}
const PNICK={Cheeky:'The Trickster',Friendly:'The Gentle Giant',Fierce:'The Meteor',Goofy:'The Wobbler',Cool:'Ice Comet',Shy:'The Quiet Storm',Proud:'The Captain',Sleepy:'The Dream Weaver'};

/* ---------- awards: the week's and season's best, picked by how unlikely and spectacular they were ---------- */
/* Award points depend on position, so the best attacker does not win every week just because attackers score the goals.
   Tuned on 1,600 simulated matches: Player of the Week went to attackers 43% of the time, midfield and wings 23%, defenders 20%, keepers 15%. */
const PTS={ATK:{g:5,a:5,kp:3,tk:1.5,sv:0,cs:0},MID:{g:9,a:7,kp:3,tk:3.4,sv:0,cs:3},DEF:{g:12,a:6,kp:3,tk:2.8,sv:0,cs:5},GK:{g:0,a:3,kp:1,tk:0,sv:3.6,cs:8}};PTS.WNG=PTS.MID;
const pval=x=>{const w=PTS[x.pos||x.role]||PTS.MID;return x.g*w.g+x.a*w.a+(x.kp||0)*w.kp+x.tk*w.tk+x.sv*w.sv+(x.cs||0)*w.cs};
const repLevel=n=>n>=15?5:n>=10?4:n>=6?3:n>=3?2:n>=1?1:0;   // awards build a reputation; each level adds 1 to every stat
function repAward(x,n,why){if(!x||x.t!==0)return;const r=S.cards.find(r=>r.seed===x.c[0]&&r.rar===x.c[1]&&r.fp===x.c[2]);if(!r)return;const b=repLevel(r.rep||0);r.rep=(r.rep||0)+n;
  if(repLevel(r.rep)>b)addNews('club',`${x.n}'s reputation grows`,`After ${why}, ${x.n} is now a Level ${repLevel(r.rep)} name across the league. The card has been upgraded.`)}
function ctxFor(home,away,condI){return{teams:[{name:home.name,c1:home.c1,c2:home.c2},{name:away.name,c1:away.c1,c2:away.c2}],arena:{name:home.name,biome:home.biome,sky:home.sky,cond:condI,fans:home.fans,cap:home.cap,c1:home.c1,c2:home.c2},cond:CONDS[condI]}}
function pickTeam(list){const srt=list.slice().sort((a,b)=>b.v-a.v),gk=srt.find(x=>x.pos==='GK'),out=srt.filter(x=>x.pos!=='GK').slice(0,5);return gk?[gk].concat(out):out}
function collect(L,W,m,ids,ctx){
  for(const[card,st]of m.pst){const t=ids[st.side],key=card.seed+'|'+card.rar+'|'+card.fp+'|'+t,c=[card.seed,card.rar,card.fp];
    const cs=m.score[1-st.side]===0?1:0,ps=L.pstats[key]||(L.pstats[key]={c,n:card.name,pos:st.role,t,gp:0,g:0,a:0,tk:0,sv:0});ps.gp++;ps.g+=st.g;ps.a+=st.a;ps.tk+=st.tk;ps.sv+=st.sv;ps.kp=(ps.kp||0)+(st.kp||0);ps.cs=(ps.cs||0)+cs;
    W.perf.push({c,n:card.name,pos:st.role,t,g:st.g,a:st.a,tk:st.tk,sv:st.sv,kp:st.kp||0,cs,v:pval({pos:st.role,g:st.g,a:st.a,tk:st.tk,sv:st.sv,kp:st.kp,cs})})}
  for(const k of['bestGoal','bestPlay']){const e=m[k];if(!e)continue;const slot=k==='bestGoal'?'goal':'play';if(!W[slot]||e.wow>W[slot].wow)W[slot]=Object.assign(packEv(e,ctx),{teams:ctx.teams.map(t=>t.name)})}
}
function seasonBoard(L){const all=Object.keys(L.pstats).map(k=>Object.assign({v:pval(L.pstats[k])},L.pstats[k])),top=(f,pos)=>all.filter(x=>!pos||x.pos===pos).sort((a,b)=>f(b)-f(a))[0];
  return{mvp:all.slice().sort((a,b)=>b.v-a.v).slice(0,5),boot:top(x=>x.g),maker:top(x=>x.a),wall:top(x=>x.tk),gloves:top(x=>x.sv,'GK'),team:pickTeam(all)}}
const awImg=x=>portraitURL(genCard(x.c[0],x.c[1],x.c[2]),teamInfo(x.t));
const FACTS=['The Lumi share one mind and have no names of their own. “Bibi” is only what coaches call theirs. A Lumi sees a move a heartbeat before the eye can, which is why they coach and never play.','A Rabbiton can cover three squares in one move. Most players manage two.','Lumi have coached every Comet Cup winner in history. They have never once played.','The first Comet Cup ball was a real comet. It was replaced after the third stadium fire.','Bouldar players are weighed before every match. The scales are replaced after every match.','A lob cannot be stopped by a defender standing next to the passer. There is no time to react.','Referees see every charge that causes an injury. Nobody knows how.','Froggle goalkeepers are banned from using their tongues. This rule was added in season two.','On Zero-G Day, the record for longest time spent stuck on a crossbar is nine minutes.','Fans give a player a nickname after five goals. Players are not allowed to choose their own.','The rarest species, the Cosmic Jelly, is about two hundred times harder to find than a Human.','Tired players recover faster at clubs with a Training Pod.','Every stadium in the galaxy must have a sky. Indoor grounds are considered unlucky.'];

/* apply a finished league match to everything: table, records, fans, coins, news */
function applyMatch(M,fx){
  const L=S.league,a=M.score[0],b=M.score[1],ev=fx.ev,opp=fx.opp,out={lines:[],inj:[]};
  if(fx.home)record(L,0,opp.id,a,b);else record(L,opp.id,0,b,a);
  addScorers(L,M,[0,opp.id]);
  const W={goal:null,play:null,perf:[]};collect(L,W,M,[0,opp.id],{teams:[{name:S.team.name,c1:S.team.c1,c2:S.team.c2},{name:opp.name,c1:opp.c1,c2:opp.c2}],arena:fx.arena,cond:fx.cond});
  const R=S.rec;R.gf+=a;R.ga+=b;
  // player records, form, nicknames
  const played=new Set(M.P.filter(p=>p.side===0).map(p=>p.card));M.used.forEach(c=>played.add(c));
  for(const c of played){const rec=recOfCard(c);if(!rec)continue;rec.st.ap++;const s=M.pst.get(c);
    if(s){rec.st.g+=s.g;rec.st.a+=s.a;rec.st.tk+=s.tk;rec.st.sv+=s.sv}
    rec.form=s&&(s.g>=1||s.sv>=3)?Math.min(2,(rec.form||0)+1):Math.max(-1,(rec.form||0)-((s&&(s.g||s.a||s.tk>1||s.sv))?0:1));if(rec.form<0&&Math.random()<.6)rec.form=0;
    if(!rec.nick&&rec.st.g>=5){rec.nick=PNICK[c.nature];addNews('club',`Fans christen ${c.name} “${rec.nick}”`,`Five goals for ${S.team.name} and the supporters have found a new hero.`)}
    if(s&&s.g>=3)addNews('match',`Hat-trick hero! ${c.name} hits ${s.g}`,`${S.team.name} supporters are still singing after a stunning display against ${opp.name}.`)}
  for(const i of M.inj){if(i.side!==0)continue;const rec=recOfCard(i.card);const hrs=Math.max(1,Math.round(i.hrs*(1-.15*S.club.medic)));if(rec){rec.inj=Date.now()+hrs*36e5;rec.injN=i.what}
    out.inj.push(`${i.card.name} has ${i.what}: out for ${hrs>=24?Math.round(hrs/24)+' day'+(hrs>=48?'s':''):hrs+' hours'}.`);addNews('club',`${i.card.name} sidelined with ${i.what}`,`The ${S.team.name} medical bay expects a full recovery.`)}
  // result, fans, coins
  const inc=income(fx.home,ev);let fanGain,head;
  if(a>b){R.w++;R.streak=Math.max(1,R.streak+1);fanGain=20+S.fans*.08;head='YOU WIN!';out.lines.push('<b>Prize:</b> '+(winCard(L.tier)?'1 new player card (open it in Packs)':'no more win cards today (5 a day)')+' and ◎ '+money(150*L.tier)+' win bonus.');S.coins+=150*L.tier}
  else if(a<b){R.l++;R.streak=Math.min(-1,R.streak-1);fanGain=-S.fans*.03;head='DEFEAT';out.lines.push('Bibi: "We\'ll get them next time, Coach!"')}
  else{R.d++;R.streak=0;fanGain=5+S.fans*.02;head='A DRAW';out.lines.push('A point each. Not bad, Coach!')}
  fanGain=Math.round((fanGain+a*5)*(fanGain>0?(ev.fans||1):1));S.fans=Math.max(50,S.fans+fanGain);S.coins+=inc.tickets+inc.merch;
  out.lines.push(`Crowd ${money(fx.home?inc.att:Math.min(opp.fans,opp.cap))} · tickets ◎ ${money(inc.tickets)} · merchandise ◎ ${money(inc.merch)} · fans ${fanGain>=0?'+':''}${money(fanGain)}`);
  const sc=M.goals.filter(g=>g.side===0).map(g=>g.name.split(' ')[0]+" "+g.min+"'").join(', ');
  addNews('match',a>b?`${S.team.name} beat ${opp.name} ${a}-${b}`:a<b?`${opp.name} too strong for ${S.team.name}, ${b}-${a}`:`${S.team.name} and ${opp.name} share the points, ${a}-${b}`,
    (sc?`Scorers: ${sc}. `:'')+`${COMM[0].name}: "${a+b>=4?'Goals everywhere! My antennae are still buzzing.':a+b===0?'Not a goal in sight, but what a battle.':'A proper contest at '+fx.stadium+'.'}"`);
  const nk=fanNickname();if(nk&&nk!==S.nick){S.nick=nk;addNews('club',`Fans have a new name for ${S.team.name}: “${nk}”`,`Banners reading “${nk}” were seen all around ${S.team.stadium}.`)}
  // hidden potential: a few players rise a tier (or more) once they have proved themselves
  for(const id of S.lineup.slots){const r=id&&recById(id);if(!r||r.awoke)continue;const c=cardOf(r),t=r.st;if(!c.aw||r.rar>=RAR.length-1||!(t.ap>=3&&(t.g>=6||t.a>=5||t.tk>=20||t.sv>=20||(r.rep||0)>=3)))continue;
    const from=RAR[r.rar].n;r.rar=Math.min(RAR.length-1,r.rar+c.aw);r.awoke=c.aw;out.lines.push(`<b>AWAKENING!</b> ${c.name} was more than anyone knew. ${from} → ${RAR[r.rar].n}!`);S.fans+=50*c.aw;
    addNews('club',`${c.name} awakens!`,`Scouts are stunned. The ${S.team.name} ${POSN[c.pos].toLowerCase()} has risen from ${from} to ${RAR[r.rar].n}${c.aw>1?', '+c.aw+' tiers at once. Almost nobody alive has seen that':''}.`)}
  // the rest of the matchday is played by the computer
  L.last=[{h:fx.home?0:opp.id,a:fx.home?opp.id:0,hg:fx.home?a:b,ag:fx.home?b:a}];
  for(const[h,w]of L.rounds[L.round]){if(h===0||w===0)continue;const th=L.teams[h],tw=L.teams[w];
    const m=M_auto(M_new({teams:[cpuSquad(th),cpuSquad(tw)],cond:CONDS[ev.cond!=null?ev.cond:th.cond],homeSide:0,human:[false,false],mods:ev.mods,seed:(th.seed^tw.seed^(L.round*977))>>>0}));
    record(L,h,w,m.score[0],m.score[1]);addScorers(L,m,[h,w]);L.last.push({h,a:w,hg:m.score[0],ag:m.score[1]});collect(L,W,m,[h,w],ctxFor(teamInfo(h),teamInfo(w),ev.cond!=null?ev.cond:th.cond))}
  const srt=W.perf.slice().sort((x,y)=>y.v-x.v);L.week={day:S.day+1,goal:W.goal,play:W.play,mvp:srt[0]||null,tow:pickTeam(W.perf)};
  repAward(L.week.mvp,2,'being named Player of the Week');L.week.tow.forEach(x=>repAward(x,1,'making the Team of the Week'));
  for(const k of['goal','play']){const g=W[k],a=g&&g.ev.stages[g.ev.stages.length-1].a;if(a&&a.c&&g.teams[a.side]===S.team.name)repAward({t:0,c:a.c,n:genCard(a.c[0],a.c[1],a.c[2]).name},2,k==='goal'?'scoring the Goal of the Week':'making the Play of the Week')}
  if(W.goal&&(!L.sGoal||W.goal.wow>L.sGoal.wow))L.sGoal=W.goal;if(W.play&&(!L.sPlay||W.play.wow>L.sPlay.wow))L.sPlay=W.play;
  if(W.goal)addNews('league','Goal of the Week: '+W.goal.desc.split(' scores')[0],W.goal.desc+'. Watch it in Cosmic Central.');if(L.week.mvp)addNews('league','Player of the Week: '+L.week.mvp.n,`${teamInfo(L.week.mvp.t).name}'s ${POSN[L.week.mvp.pos].toLowerCase()} tops the ratings with ${L.week.mvp.g} goals, ${L.week.mvp.a} assists, ${L.week.mvp.tk} tackles and ${L.week.mvp.sv} saves.`);
  const other=L.last.slice(1).sort((x,y)=>(y.hg+y.ag)-(x.hg+x.ag))[0];
  if(other)addNews('league',`Elsewhere: ${L.teams[other.h].name} ${other.hg}-${other.ag} ${L.teams[other.a].name}`,`${COMM[1].name}: "${other.hg+other.ag>=5?'Somebody tell the defenders the match has started.':'A tidy result in the '+TIERS[L.tier-1]+'.'}"`);
  L.round++;S.day++;
  if(L.round>=7){const pos=myPos(),tier=L.tier;let nt=tier;const sb=seasonBoard(L),champ=teamInfo(standings()[0].id).name;
    S.honours=S.honours||[];S.honours.unshift({season:L.season,tier,champ,mvp:sb.mvp[0]?sb.mvp[0].n+' ('+teamInfo(sb.mvp[0].t).name+')':'',boot:sb.boot?sb.boot.n+', '+sb.boot.g+' goals':'',goal:L.sGoal?L.sGoal.desc:''});S.honours.length=Math.min(12,S.honours.length);
    if(pos<=2&&tier<10){nt=tier+1;out.lines.push(`<b>PROMOTED!</b> ${ord(pos)} place. Welcome to the ${TIERS[nt-1]}. Bonus: Gold Pack and ◎ ${money(1000*tier)}.`);grantPack('gold');S.coins+=1000*tier;S.fans=Math.round(S.fans*1.3);addNews('league',`${S.team.name} are promoted to the ${TIERS[nt-1]}!`,`A ${ord(pos)}-place finish sends the fans into orbit.`)}
    else if(pos===1&&tier===10){S.titles++;out.lines.push('<b>COMET CUP CHAMPIONS!</b> The whole galaxy salutes you. Bonus: Cosmic Crate.');grantPack('cosmic');S.fans=Math.round(S.fans*1.5);addNews('league',`${S.team.name} win the Comet Cup!`,'Champions of everything, everywhere.')}
    else if(pos>=7&&tier>1){nt=tier-1;out.lines.push(`Relegated to the ${TIERS[nt-1]}. Time to rebuild.`);addNews('league',`${S.team.name} drop to the ${TIERS[nt-1]}`,'The fans vow to stick with the team.')}
    else{out.lines.push(`Season over: ${ord(pos)} of 8 in the ${TIERS[tier-1]}. ${tier<10?'Top two go up.':''}`);addNews('league',`${S.team.name} finish ${ord(pos)} in the ${TIERS[tier-1]}`,'A new season starts next matchday.')}
    S.best=Math.max(S.best,nt);S.league=newLeague(nt,L.season+1)}
  const e2=worldEvent();if(e2.id)addNews('world','World event: '+e2.n,e2.d);
  out.head=head;return out;
}

function crowdShot(c,W,H,now,t,key,mode){

function cine(cv,e,s){

function playEvents(evs,force,ctx){
